<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Lite - Fixed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Fredoka One', cursive, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            width: 960px;
            height: 540px;
            background: linear-gradient(135deg, #ff3300 0%, #cc0000 100%);
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 6px solid #880000;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            background: transparent;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .game-title-container {
            text-align: center;
            margin-top: 10px;
        }

        .game-title {
            font-size: 56px;
            font-weight: bold;
            display: inline-block;
            letter-spacing: 2px;
            color: #55ff00;
            text-shadow: 4px 4px 0px #000, -3px -3px 0px #000, 3px -3px 0px #000, -3px 3px 0px #000, 0px 6px 15px rgba(0,0,0,0.6);
        }

        .game-title-lite {
            font-size: 46px;
            color: #ffcc00;
            margin-left: 15px;
            text-shadow: 4px 4px 0px #000, -3px -3px 0px #000, 3px -3px 0px #000, -3px 3px 0px #000, 0px 6px 15px rgba(0,0,0,0.6);
        }

        .center-hub {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            padding: 0 40px;
        }

        .menu-btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .menu-btn-group:hover { transform: scale(1.08); }

        .icon-circle {
            width: 95px;
            height: 95px;
            background: #22aa00;
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 0 #115500, 0 10px 20px rgba(0,0,0,0.5);
        }

        .icon-circle.yellow {
            background: #ffcc00;
            box-shadow: 0 8px 0 #aa8800, 0 10px 20px rgba(0,0,0,0.5);
        }

        .menu-label {
            margin-top: 8px;
            font-size: 16px;
            color: #ffffff;
            text-shadow: 2px 2px 0px #000;
            text-align: center;
        }

        .play-btn-wrapper {
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
        }

        .play-btn-wrapper:hover { transform: scale(1.1); }

        .play-big-icon {
            width: 140px;
            height: 140px;
            background: #22aa00;
            border: 6px solid #ffffff;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 0 #115500, 0 15px 30px rgba(0,0,0,0.6);
            transform: rotate(45deg);
        }

        .play-triangle {
            width: 0;
            height: 0;
            border-top: 35px solid transparent;
            border-bottom: 35px solid transparent;
            border-left: 60px solid #ffee00;
            transform: rotate(-45deg);
            filter: drop-shadow(2px 2px 0px #000);
        }

        .bottom-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .social-icons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .social-btn {
            width: 38px;
            height: 38px;
            background: #0077ff;
            border: 2px solid #ffffff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 0 #0044aa;
            cursor: pointer;
        }
        .social-btn.yt { background: #ff0000; box-shadow: 0 4px 0 #990000; }
        .social-btn.tw { background: #00aced; box-shadow: 0 4px 0 #006699; }
        .social-btn.dc { background: #7289da; box-shadow: 0 4px 0 #404e8a; }

        .robtop-logo {
            background: #ff8800;
            border: 2px solid #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            box-shadow: 0 3px 0 #aa5500;
        }

        .center-tools { display: flex; gap: 12px; }

        .tool-circle-btn {
            width: 50px;
            height: 50px;
            background: #22aa00;
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 5px 0 #115500;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .tool-circle-btn:hover { transform: scale(1.1); }

        .free-levels-badge {
            background: #22aa00;
            border: 3px solid #ffffff;
            padding: 10px 18px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 6px 0 #115500, 0 8px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .free-levels-badge:hover { transform: scale(1.05); }
        .free-levels-badge span { display: block; font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #000; }

        #level-screen { background: rgba(150, 0, 0, 0.92); }

        .level-grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-height: 380px;
            overflow-y: auto;
            padding: 10px;
            width: 100%;
        }

        .level-card {
            background: #003366;
            border: 3px solid #00ffff;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 5px 0 #001133;
            transition: 0.2s;
        }
        .level-card:hover { background: #0055aa; transform: scale(1.03); }
        .level-card h3 { margin: 0 0 4px 0; font-size: 16px; color: #55ff00; text-shadow: 1px 1px 0 #000; }
        .level-card p { margin: 0; font-size: 11px; color: #ddd; }

        .btn-custom {
            background: #55ff00;
            color: #000;
            border: 3px solid #fff;
            padding: 10px 25px;
            font-size: 18px;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            border-radius: 14px;
            box-shadow: 0 5px 0 #228800;
            transition: 0.1s;
        }
        .btn-custom:hover { transform: scale(1.05); background: #77ff33; }

        .panel-box {
            background: rgba(0, 0, 40, 0.95);
            border: 4px solid #55ff00;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            width: 460px;
            margin: auto;
        }

        #game-screen { background: transparent; padding: 15px 25px; }

        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            width: calc(100% - 40px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-btn {
            background: rgba(0,0,0,0.5);
            border: 2px solid white;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #progress-container {
            width: 450px;
            height: 14px;
            background: rgba(0,0,0,0.6);
            border: 2px solid white;
            border-radius: 7px;
            overflow: hidden;
        }

        #progress-bar { width: 0%; height: 100%; background: #55ff00; }

        #attempt-display {
            position: absolute;
            top: 75px;
            left: 30px;
            font-size: 26px;
            color: white;
            text-shadow: 2px 2px 0 #000;
            display: none;
            z-index: 10;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            background: linear-gradient(135deg, #002288 0%, #000822 100%);
            z-index: 1;
        }
    </style>
</head>
<body>

<div id="game-container">

    <div id="main-menu" class="screen">
        <div class="game-title-container">
            <span class="game-title">GEOMETRY DASH</span>
            <span class="game-title-lite">LITE</span>
        </div>

        <div class="center-hub">
            <div class="menu-btn-group" onclick="openCharacterSelect()">
                <div class="icon-circle">
                    <div style="width: 40px; height: 40px; background: #55ff00; border: 3px solid #fff; position: relative;">
                        <div style="position: absolute; top: 8px; left: 6px; width: 8px; height: 8px; background: #000;"></div>
                        <div style="position: absolute; top: 8px; right: 6px; width: 8px; height: 8px; background: #000;"></div>
                    </div>
                </div>
                <div class="menu-label">Character Select</div>
            </div>

            <div class="play-btn-wrapper" onclick="openLevelSelect()">
                <div class="play-big-icon">
                    <div class="play-triangle"></div>
                </div>
            </div>

            <div class="menu-btn-group" onclick="alert('Online Levels đang cập nhật!')">
                <div class="icon-circle yellow">
                    <span style="font-size: 32px;">🛠️</span>
                </div>
                <div class="menu-label">Online Levels</div>
            </div>
        </div>

        <div class="bottom-toolbar">
            <div class="social-icons">
                <div class="social-btn">f</div>
                <div class="social-btn tw">t</div>
                <div class="social-btn yt">▶</div>
                <div class="social-btn dc">💬</div>
                <div><div class="robtop-logo">ROBTOP</div></div>
            </div>

            <div class="center-tools">
                <div class="tool-circle-btn" title="Thành tích">🏆</div>
                <div class="tool-circle-btn" title="Cài đặt">⚙️</div>
                <div class="tool-circle-btn" title="Thống kê">📊</div>
                <div class="tool-circle-btn" title="Tùy chỉnh Nhạc" onclick="openMusicPanel()">🎵</div>
            </div>

            <div class="free-levels-badge" onclick="openLevelSelect()">
                <span>FREE</span>
                <span>LEVELS</span>
            </div>
        </div>
    </div>

    <div id="level-screen" class="screen hidden" style="z-index: 5;">
        <h2 style="color: #55ff00; text-align: center; margin: 5px 0; text-shadow: 2px 2px 0 #000;">CHỌN 16 MÀN CHƠI</h2>
        <div class="level-grid-container" id="level-grid"></div>
        <div style="text-align: center; margin-top: 5px;">
            <button class="btn-custom" onclick="backToMenu()">QUAY LẠI MENU</button>
        </div>
    </div>

    <div id="char-screen" class="screen hidden" style="z-index: 5;">
        <div class="panel-box">
            <h2 style="color: #55ff00; margin-top: 0;">MÀU SẮC NHÂN VẬT</h2>
            <div style="display: flex; justify-content: center; gap: 15px; margin: 20px 0;">
                <div onclick="selectColor('#55ff00')" style="width: 45px; height: 45px; background: #55ff00; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
                <div onclick="selectColor('#ff3333')" style="width: 45px; height: 45px; background: #ff3333; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
                <div onclick="selectColor('#00ffff')" style="width: 45px; height: 45px; background: #00ffff; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
                <div onclick="selectColor('#ffff00')" style="width: 45px; height: 45px; background: #ffff00; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
                <div onclick="selectColor('#ff00ff')" style="width: 45px; height: 45px; background: #ff00ff; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
            </div>
            <button class="btn-custom" onclick="backToMenu()">XÁC NHẬN</button>
        </div>
    </div>

    <div id="music-screen" class="screen hidden" style="z-index: 5;">
        <div class="panel-box">
            <h2 style="color: #00ffff; margin-top: 0;">THÊM NHẠC TÙY THÍCH</h2>
            <p style="font-size: 13px; color: #ccc;">Chọn file nhạc MP3/WAV từ máy tính:</p>
            <input type="file" id="audio-file-input" accept="audio/*" onchange="loadCustomMusic(event)" style="margin: 15px 0; color: #fff;"><br>
            <p id="music-msg" style="color: #55ff00; font-size: 13px;"></p>
            <button class="btn-custom" onclick="backToMenu()">XONG</button>
        </div>
    </div>

    <div id="game-screen" class="screen hidden" style="z-index: 5;">
        <div id="hud">
            <button class="hud-btn" onclick="pauseGame()">⏸</button>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <button class="hud-btn" onclick="togglePractice()" id="practice-btn">🛡️</button>
        </div>
        <div id="attempt-display">ATTEMPT 1</div>
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <div id="pause-screen" class="screen hidden" style="z-index: 10; background: rgba(0,0,0,0.85);">
        <div class="panel-box">
            <h2 style="color: #ffff00; margin-top: 0;">TẠM DỪNG</h2>
            <button class="btn-custom" onclick="resumeGame()" style="margin: 8px 0; width: 80%;">TIẾP TỤC</button><br>
            <button class="btn-custom" onclick="restartLevel()" style="background: #00ffff; margin: 8px 0; width: 80%;">CHƠI LẠI</button><br>
            <button class="btn-custom" onclick="exitToMenu()" style="background: #ff3333; color: white; margin: 8px 0; width: 80%;">THOÁT RA MENU</button>
        </div>
    </div>

</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentScreen = "main-menu";
    let selectedLevel = 1;
    let playerColor = "#55ff00";
    let isPaused = false;
    let attemptCount = 1;
    let practiceMode = false;
    let backgroundMusic = new Audio();

    function loadCustomMusic(event) {
        const file = event.target.files[0];
        if (file) {
            backgroundMusic.src = URL.createObjectURL(file);
            backgroundMusic.loop = true;
            document.getElementById("music-msg").innerText = "Đã tải nhạc: " + file.name;
        }
    }

    const levelGrid = document.getElementById("level-grid");
    const levelConfigs = [];
    const levelNames = [
        "Stereo Madness", "Back On Track", "Polargeist", "Dry Out",
        "Base After Base", "Can't Let Go", "Jumper", "Time Machine",
        "Cycles", "xStep", "Clutterfunk", "Theory of Everything",
        "Electroman Adventures", "Clubstep", "Electrodynamix", "Fingerdash"
    ];

    for (let i = 1; i <= 16; i++) {
        levelConfigs.push({ id: i, name: levelNames[i-1], length: 3500 + i * 350 });
        const card = document.createElement("div");
        card.className = "level-card";
        card.innerHTML = `<h3>${i}. ${levelNames[i-1]}</h3><p>Độ khó: ${Math.min(10, Math.ceil(i/1.6))}★</p>`;
        card.onclick = () => startLevel(i);
        levelGrid.appendChild(card);
    }

    function showScreen(screenId) {
        document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
        document.getElementById(screenId).classList.remove("hidden");
        currentScreen = screenId;
    }

    function openLevelSelect() { showScreen("level-screen"); }
    function openCharacterSelect() { showScreen("char-screen"); }
    function openMusicPanel() { showScreen("music-screen"); }
    function backToMenu() { showScreen("main-menu"); backgroundMusic.pause(); }
    function selectColor(color) { playerColor = color; }

    let player = {
        x: 180, y: 450, size: 36, vy: 0, gravity: 2200, jumpForce: -620,
        rotation: 0, grounded: false
    };
    let obstacles = [];
    let gameProgress = 0;
    let currentConfig = null;
    let lastTime = 0;

    function startLevel(levelId) {
        selectedLevel = levelId;
        currentConfig = levelConfigs[levelId - 1];
        showScreen("game-screen");
        attemptCount = 1;
        resetGameSession();
        if (backgroundMusic.src) {
            backgroundMusic.currentTime = 0;
            backgroundMusic.play().catch(e => console.log("Audio blocked"));
        }
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function resetGameSession() {
        player.x = 180;
        player.y = 450;
        player.vy = 0;
        player.rotation = 0;
        player.grounded = true;
        gameProgress = 0;
        isPaused = false;
        document.getElementById("pause-screen").classList.add("hidden");
        document.getElementById("attempt-display").innerText = "ATTEMPT " + attemptCount;
        document.getElementById("attempt-display").style.display = "block";
        setTimeout(() => { document.getElementById("attempt-display").style.display = "none"; }, 1400);

        obstacles = [];
        let genX = 700;
        while (genX < currentConfig.length) {
            let isSpike = Math.random() > 0.35;
            obstacles.push({ x: genX, y: 480, width: 36, height: 36, type: isSpike ? "spike" : "block" });
            genX += Math.floor(Math.random() * 250) + 180;
        }
    }

    function pauseGame() {
        isPaused = true;
        document.getElementById("pause-screen").classList.remove("hidden");
        backgroundMusic.pause();
    }

    function resumeGame() {
        isPaused = false;
        document.getElementById("pause-screen").classList.add("hidden");
        if (backgroundMusic.src) backgroundMusic.play();
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function restartLevel() {
        attemptCount++;
        resetGameSession();
        if (backgroundMusic.src) {
            backgroundMusic.currentTime = 0;
            backgroundMusic.play();
        }
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function exitToMenu() {
        isPaused = true;
        backgroundMusic.pause();
        backToMenu();
    }

    function togglePractice() {
        practiceMode = !practiceMode;
        document.getElementById("practice-btn").style.borderColor = practiceMode ? "#55ff00" : "white";
    }

    window.addEventListener("keydown", (e) => {
        if ((e.code === "Space" || e.code === "ArrowUp") && currentScreen === "game-screen" && !isPaused) {
            if (player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }
        }
    });

    canvas.addEventListener("mousedown", () => {
        if (currentScreen === "game-screen" && !isPaused && player.grounded) {
            player.vy = player.jumpForce;
            player.grounded = false;
        }
    });

    function gameLoop(timestamp) {
        if (currentScreen !== "game-screen" || isPaused) return;

        let deltaTime = (timestamp - lastTime) / 1000;
        if (deltaTime > 0.1) deltaTime = 0.016; // Chống giật khung hình
        lastTime = timestamp;

        // Chuẩn hóa vật lý độc lập tần số quét màn hình
        player.vy += player.gravity * deltaTime;
        player.y += player.vy * deltaTime;

        if (player.y >= 480) {
            player.y = 480;
            player.vy = 0;
            player.grounded = true;
            player.rotation = Math.round(player.rotation / 90) * 90;
        } else {
            player.grounded = false;
            player.rotation += 450 * deltaTime;
        }

        let gameSpeed = 380; // Tốc độ di chuyển chuẩn xác
        gameProgress += gameSpeed * deltaTime;
        let percent = Math.min(100, Math.floor((gameProgress / currentConfig.length) * 100));
        document.getElementById("progress-bar").style.width = percent + "%";

        if (gameProgress >= currentConfig.length) {
            alert("CHIẾN THẮNG! HOÀN THÀNH MÀN " + selectedLevel);
            backToMenu();
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Vẽ lưới
        ctx.strokeStyle = "rgba(0, 255, 255, 0.08)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 45) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 45) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Sàn nhà
        ctx.fillStyle = "#001133";
        ctx.fillRect(0, 480, canvas.width, 60);
        ctx.fillStyle = "#00ffff";
        ctx.fillRect(0, 480, canvas.width, 5);

        // Chướng ngại vật & Va chạm
        obstacles.forEach(obs => {
            let screenX = obs.x - gameProgress;
            if (obs.type === "spike") {
                ctx.fillStyle = "#ff2222";
                ctx.beginPath();
                ctx.moveTo(screenX, 480);
                ctx.lineTo(screenX + obs.width / 2, 480 - obs.height);
                ctx.lineTo(screenX + obs.width, 480);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                ctx.fillStyle = "#ff6600";
                ctx.fillRect(screenX, 480 - obs.height, obs.width, obs.height);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.strokeRect(screenX, 480 - obs.height, obs.width, obs.height);
            }

            let pBox = { x: player.x, y: player.y - player.size, w: player.size, h: player.size };
            let oBox = { x: screenX, y: 480 - obs.height, w: obs.width, h: obs.height };

            if (pBox.x < oBox.x + oBox.w && pBox.x + pBox.w > oBox.x &&
                pBox.y < oBox.y + oBox.h && pBox.y + pBox.h > oBox.y) {
                setTimeout(() => { restartLevel(); }, 250);
                return;
            }
        });

        // Vẽ nhân vật
        ctx.save();
        ctx.translate(player.x + player.size/2, player.y - player.size/2);
        ctx.rotate((player.rotation * Math.PI) / 180);
        ctx.fillStyle = playerColor;
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.fillStyle = "#000";
        ctx.fillRect(2, -8, 8, 8);
        ctx.restore();

        requestAnimationFrame(gameLoop);
    }
</script>

</body>
</html>
