<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Full Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000411;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 102, 255, 0.6);
            border-radius: 6px;
            overflow: hidden;
            border: 3px solid #0066ff;
        }
        canvas {
            display: block;
            background: #001133;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="850" height="480"></canvas>
    <input type="file" id="musicUploader" accept="audio/*" style="display: none;" />
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const musicInput = document.getElementById('musicUploader');

// Game States: MAIN_MENU, LEVEL_SELECT, PLAYING, GAMEOVER
let gameState = "MAIN_MENU"; 
let bgOffset = 0;
let customAudio = new Audio();
let isCustomMusicLoaded = false;

// 15 Levels + 1 The Tower
const levels = [
    { name: "STEREO MADNESS", stars: 1, diff: "EASY", color: "#0044cc", speed: 6.5, bgHue: 220 },
    { name: "BACK ON TRACK", stars: 2, diff: "EASY", color: "#0088ff", speed: 6.8, bgHue: 200 },
    { name: "POLARGEIST", stars: 3, diff: "NORMAL", color: "#00cc66", speed: 7.0, bgHue: 140 },
    { name: "DRY OUT", stars: 4, diff: "NORMAL", color: "#ff8800", speed: 7.2, bgHue: 30 },
    { name: "BASE AFTER BASE", stars: 5, diff: "HARD", color: "#0033aa", speed: 7.0, bgHue: 240 },
    { name: "CAN'T LET GO", stars: 6, diff: "HARD", color: "#cc0000", speed: 7.5, bgHue: 0 },
    { name: "JUMPER", stars: 7, diff: "HARDER", color: "#aa00cc", speed: 7.8, bgHue: 280 },
    { name: "TIME MACHINE", stars: 8, diff: "HARDER", color: "#00aa88", speed: 8.0, bgHue: 170 },
    { name: "CYCLES", stars: 9, diff: "HARDER", color: "#88aa00", speed: 8.2, bgHue: 70 },
    { name: "XSTEP", stars: 10, diff: "INSANE", color: "#00bbcc", speed: 8.5, bgHue: 190 },
    { name: "CLUTTERFUNK", stars: 11, diff: "INSANE", color: "#cc5500", speed: 8.8, bgHue: 20 },
    { name: "THEORY OF EVERYTHING", stars: 12, diff: "INSANE", color: "#ff0066", speed: 9.0, bgHue: 330 },
    { name: "ELECTROMAN ADVENTURES", stars: 10, diff: "INSANE", color: "#00ccff", speed: 8.7, bgHue: 195 },
    { name: "CLUBSTEP", stars: 14, diff: "DEMON", color: "#880000", speed: 9.2, bgHue: 350 },
    { name: "ELECTRODYNAMIX", stars: 12, diff: "INSANE", color: "#00ffaa", speed: 9.5, bgHue: 160 },
    { name: "THE TOWER", stars: 15, diff: "SPECIAL", color: "#330066", speed: 7.5, bgHue: 270, isTower: true }
];

let currentLevelIdx = 0;
let attemptCount = 1;
const GROUND_Y = 380;

let player = {
    x: 140,
    y: GROUND_Y - 32,
    size: 32,
    velocityY: 0,
    gravity: 0.9,
    jumpStrength: -13,
    rotation: 0,
    isGrounded: false
};

let particles = [];
let obstacles = [];
let frameCount = 0;
let isHolding = false;

// Custom Music Upload
musicInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        if (customAudio) {
            customAudio.pause();
        }
        const url = URL.createObjectURL(file);
        customAudio.src = url;
        customAudio.loop = true;
        isCustomMusicLoaded = true;
        alert("Đã tải nhạc thành công: " + file.name);
    }
});

function handleAction() {
    if (gameState === "MAIN_MENU") {
        gameState = "LEVEL_SELECT";
    } else if (gameState === "LEVEL_SELECT") {
        startLevel();
    } else if (gameState === "PLAYING" && player.isGrounded) {
        player.velocityY = player.jumpStrength;
        player.isGrounded = false;
        createTrailParticles(player.x, player.y + player.size, 6);
    } else if (gameState === "GAMEOVER") {
        startLevel();
    }
}

// Keyboard controls
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (!isHolding) handleAction();
        isHolding = true;
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') isHolding = false;
});

// Mouse/Touch controls
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (gameState === "MAIN_MENU") {
        if (mx > 365 && mx < 485 && my > 180 && my < 300) {
            gameState = "LEVEL_SELECT";
        }
    } else if (gameState === "LEVEL_SELECT") {
        // Mũi tên trái
        if (mx > 30 && mx < 90 && my > 200 && my < 280) {
            currentLevelIdx = (currentLevelIdx - 1 + levels.length) % levels.length;
        }
        // Mũi tên phải
        else if (mx > 760 && mx < 820 && my > 200 && my < 280) {
            currentLevelIdx = (currentLevelIdx + 1) % levels.length;
        }
        // Chọn màn (Khung giữa)
        else if (mx > 200 && mx < 650 && my > 70 && my < 360) {
            startLevel();
        }
        // Nút thêm nhạc
        else if (mx > 270 && mx < 580 && my > 390 && my < 435) {
            musicInput.click();
        }
        // Nút Back quay lại menu
        else if (mx > 20 && mx < 70 && my > 20 && my < 70) {
            gameState = "MAIN_MENU";
        }
    } else if (gameState === "PLAYING" || gameState === "GAMEOVER") {
        if (!isHolding) handleAction();
        isHolding = true;
    }
});

canvas.addEventListener('mouseup', () => isHolding = false);

function startLevel() {
    gameState = "PLAYING";
    obstacles = [];
    particles = [];
    player.y = GROUND_Y - player.size;
    player.velocityY = 0;
    player.rotation = 0;
    player.isGrounded = true;
    frameCount = 0;
    
    if (isCustomMusicLoaded) {
        customAudio.currentTime = 0;
        customAudio.play().catch(() => {});
    }
}

function createTrailParticles(x, y, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x - Math.random() * 10,
            y: y - Math.random() * 8,
            vx: -Math.random() * 3 - 1,
            vy: (Math.random() - 0.5) * 2,
            size: Math.random() * 5 + 3,
            life: 15,
            color: '#aaffff'
        });
    }
}

function createExplosion(x, y) {
    for (let i = 0; i < 35; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            size: Math.random() * 8 + 4,
            life: 30,
            color: Math.random() > 0.5 ? '#70ff00' : '#00ffff'
        });
    }
}

function update() {
    bgOffset = (bgOffset + 1.5) % 120;

    if (gameState !== "PLAYING") return;

    const curLvl = levels[currentLevelIdx];
    frameCount++;

    if (frameCount % Math.max(45, Math.floor(620 / curLvl.speed)) === 0) {
        let rand = Math.random();
        if (rand < 0.6) {
            obstacles.push({ x: canvas.width, y: GROUND_Y, w: 32, h: 32, type: 'spike' });
        } else if (rand < 0.85) {
            obstacles.push({ x: canvas.width, y: GROUND_Y, w: 32, h: 32, type: 'spike' });
            obstacles.push({ x: canvas.width + 32, y: GROUND_Y, w: 32, h: 32, type: 'spike' });
        } else {
            obstacles.push({ x: canvas.width, y: GROUND_Y - 36, w: 36, h: 36, type: 'block' });
        }
    }

    // Physics
    player.velocityY += player.gravity;
    player.y += player.velocityY;

    if (player.y + player.size >= GROUND_Y) {
        player.y = GROUND_Y - player.size;
        player.velocityY = 0;
        player.isGrounded = true;
        player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
    } else {
        player.rotation += 0.16;
        player.isGrounded = false;
        if (frameCount % 2 === 0) createTrailParticles(player.x, player.y + player.size / 2, 1);
    }

    // Particles Update
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Collisions
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= curLvl.speed;

        let margin = 6;
        if (
            player.x + margin < obs.x + obs.w &&
            player.x + player.size - margin > obs.x &&
            player.y + margin < (obs.type === 'spike' ? obs.y : obs.y + obs.h) &&
            player.y + player.size - margin > (obs.type === 'spike' ? obs.y - obs.h : obs.y)
        ) {
            createExplosion(player.x + player.size / 2, player.y + player.size / 2);
            gameState = "GAMEOVER";
            attemptCount++;
            if (isCustomMusicLoaded) customAudio.pause();
        }

        if (obs.x + obs.w < 0) obstacles.splice(i, 1);
    }
}

function drawTextWithBorder(text, x, y, fontSize, fillCol = '#ffffff', strokeCol = '#000000') {
    ctx.font = ${fontSize}px 'Arial Black', Impact, sans-serif;
    ctx.textAlign = 'center';
    ctx.lineWidth = Math.max(4, fontSize / 7);
    ctx.strokeStyle = strokeCol;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fillCol;
    ctx.fillText(text, x, y);
    ctx.textAlign = 'left';
}

function drawBackground(color, hue = 220) {
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, hsl(${hue}, 80%, 15%));
    grad.addColorStop(1, hsl(${hue}, 90%, 35%));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = hsla(${hue}, 100%, 50%, 0.2);
    ctx.lineWidth = 3;
    let blockSize = 80;
    for (let x = -bgOffset; x < canvas.width + blockSize; x += blockSize) {
        for (let y = 0; y < canvas.height; y += blockSize) {
            ctx.strokeRect(x, y, blockSize, blockSize);
        }
    }
}

function drawMainMenu() {
    drawBackground('#001133', 15);

    drawTextWithBorder("GEOMETRY DASH", canvas.width / 2, 90, 48, '#70ff00');
    drawTextWithBorder("LITE", canvas.width / 2 + 180, 125, 32, '#ffcc00');

    // Nút Play chính giữa
    ctx.fillStyle = '#00cc44';
    ctx.fillRect(365, 180, 120, 120);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5;
    ctx.strokeRect(365, 180, 120, 120);

    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.moveTo(405, 210);
    ctx.lineTo(455, 240);
    ctx.lineTo(405, 270);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Nút chọn nhân vật trái
    ctx.fillStyle = '#00aaff';
    ctx.fillRect(250, 205, 75, 75);
    ctx.strokeRect(250, 205, 75, 75);
    drawTextWithBorder("CUBE", 287, 250, 16);

    // Nút Online phải
    ctx.fillStyle = '#00aaff';
    ctx.fillRect(525, 205, 75, 75);
    ctx.strokeRect(525, 205, 75, 75);
    drawTextWithBorder("ONLINE", 562, 250, 14);

    drawTextWithBorder("ROBTOP WEB", canvas.width / 2, 440, 20, '#ffffff');
}

function drawLevelSelect() {
    const lvl = levels[currentLevelIdx];
    drawBackground(lvl.color, lvl.bgHue);

    // Nút Quay Lại
    ctx.fillStyle = '#ff2255';
    ctx.beginPath();
    ctx.moveTo(65, 25);
    ctx.lineTo(25, 45);
    ctx.lineTo(65, 65);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Khung màn chơi chuẩn GD
    ctx.fillStyle = 'rgba(0, 8, 30, 0.85)';
    ctx.fillRect(200, 70, 450, 290);
    ctx.strokeStyle = '#0088ff';
    ctx.lineWidth = 4;
    ctx.strokeRect(200, 70, 450, 290);

    drawTextWithBorder(lvl.name, canvas.width / 2, 115, 26, lvl.isTower ? '#ff33ff' : '#ffffff');
    drawTextWithBorder(${lvl.stars} ★, canvas.width / 2 + 180, 115, 20, '#ffcc00');

    // Biểu tượng độ khó
    ctx.fillStyle = lvl.isTower ? '#aa00ff' : '#00ccff';
    ctx.beginPath();
    ctx.arc(250, 175, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Thanh Normal Mode
    drawTextWithBorder("NORMAL MODE", canvas.width / 2, 195, 14, '#ffffff');
    ctx.fillStyle = '#111';
    ctx.fillRect(280, 205, 300, 22);
    ctx.fillStyle = '#00ff44';
    ctx.fillRect(280, 205, 180, 22);
    drawTextWithBorder("60%", canvas.width / 2 + 30, 221, 14, '#ffffff');

    // Thanh Practice Mode
    drawTextWithBorder("PRACTICE MODE", canvas.width / 2, 250, 14, '#ffffff');
    ctx.fillStyle = '#111';
    ctx.fillRect(280, 260, 300, 22);
    drawTextWithBorder("0%", canvas.width / 2 + 30, 276, 14, '#ffffff');

    // Mũi tên trái / phải
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(80, 200); ctx.lineTo(30, 240); ctx.lineTo(80, 280); ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(770, 200); ctx.lineTo(820, 240); ctx.lineTo(770, 280); ctx.closePath(); ctx.fill();

    // Nút Thêm Nhạc
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(270, 390, 310, 45);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeRect(270, 390, 310, 45);
    drawTextWithBorder(isCustomMusicLoaded ? "🎵 ĐÃ THÊM NHẠC" : "🎵 THÊM NHẠC MP3", canvas.width / 2, 420, 18, '#000000', '#ffffff');
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
    ctx.rotate(player.rotation);

    ctx.fillStyle = '#70ff00';
    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);

    ctx.fillStyle = '#00e1ff';
    ctx.fillRect(-6, -6, 12, 12);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.strokeRect(-6, -6, 12, 12);

    ctx.restore();
}

function drawGame() {
    const lvl = levels[currentLevelIdx];
    drawBackground(lvl.color, lvl.bgHue);

    ctx.fillStyle = '#000d2a';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    obstacles.forEach(obs => {
        if (obs.type === 'spike') {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(obs.x, obs.y);
            ctx.lineTo(obs.x + obs.w / 2, obs.y - obs.h);
            ctx.lineTo(obs.x + obs.w, obs.y);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.moveTo(obs.x + 4, obs.y - 2);
            ctx.lineTo(obs.x + obs.w / 2, obs.y - obs.h + 6);
            ctx.lineTo(obs.x + obs.w - 4, obs.y - 2);
            ctx.closePath();
            ctx.fill();
        } else {
            ctx.fillStyle = '#000d2a';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.strokeStyle = '#0088ff';
            ctx.lineWidth = 3;
            ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
        }
    });

    if (gameState !== "GAMEOVER") {
        drawPlayer();
    }

    if (gameState === "PLAYING") {
        drawTextWithBorder(ATTEMPT ${attemptCount}, canvas.width / 2, 80, 36);
    } else if (gameState === "GAMEOVER") {
        drawTextWithBorder(ATTEMPT ${attemptCount}, canvas.width / 2, 180, 42, '#ff3355');
        drawTextWithBorder("CLICK HOẶC SPACE ĐỂ CHƠI LẠI", canvas.width / 2, 240, 22);
    }
}

function draw() {
    if (gameState === "MAIN_MENU") {
        drawMainMenu();
    } else if (gameState === "LEVEL_SELECT") {
        drawLevelSelect();
    } else {
        drawGame();
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
