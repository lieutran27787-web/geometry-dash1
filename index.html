<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Fixed Version</title>
    <style>
        body {
            background-color: #0b0b14;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #menuScreen {
            position: absolute;
            width: 850px;
            height: 420px;
            background: linear-gradient(135deg, #0e0e24, #1b1b42);
            border: 4px solid #333366;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.25);
            z-index: 20;
        }

        .menu-title {
            font-size: 26px;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
        }

        .menu-sections {
            display: flex;
            gap: 15px;
            width: 100%;
            height: 250px;
        }

        .level-grid {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            overflow-y: auto;
            padding: 5px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px solid #222244;
        }

        .skin-panel {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 1px solid #222244;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .level-card {
            background: #181830;
            border: 2px solid #444488;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .level-card:hover { border-color: #00ffcc; background: #222244; }
        .level-card.selected { border-color: #ffaa00; background: #2a2211; box-shadow: 0 0 8px #ffaa00; }
        .level-card h4 { margin: 0 0 2px 0; color: #fff; font-size: 13px; }
        .level-card p { margin: 0; color: #aaa; font-size: 10px; }

        .skin-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }

        .skin-btn {
            background: #1a1a38;
            border: 2px solid #555;
            border-radius: 6px;
            padding: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: 0.2s;
        }
        .skin-btn:hover { border-color: #fff; }
        .skin-btn.selected { border-color: #00ffcc; box-shadow: 0 0 10px #00ffcc; }

        .menu-footer {
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            justify-content: space-between;
        }

        .play-btn {
            background: linear-gradient(to bottom, #00ffcc, #00aa88);
            color: #0b0b14;
            border: none;
            padding: 8px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,255,204,0.5);
            transition: 0.2s;
        }
        .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px #00ffcc; }

        .game-container { position: relative; display: none; }
        canvas { border: 4px solid #1c1c38; background: #101020; box-shadow: 0 0 40px rgba(0, 255, 204, 0.3); border-radius: 12px; }

        #attemptsDisplay {
            position: absolute; top: 12px; left: 15px; font-size: 18px; font-weight: bold; color: #ffaa00;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.6); pointer-events: none; z-index: 10;
        }

        .top-bar { position: absolute; top: 10px; right: 15px; display: flex; gap: 10px; z-index: 10; }
        .action-btn {
            background: #1a1a38; color: #00ffcc; border: 2px solid #00ffcc; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        .action-btn:hover { background: #00ffcc; color: #0b0b14; }

        #info { font-size: 15px; margin-top: 10px; font-weight: bold; color: #ff0055; text-shadow: 0 0 8px rgba(255,0,85,0.4); display: none; }
    </style>
</head>
<body>

    <!-- MENU CHỌN MÀN -->
    <div id="menuScreen">
        <h2 class="menu-title">GEOMETRY DASH FIXED</h2>
        
        <div class="menu-sections">
            <div class="level-grid" id="levelGrid"></div>
            
            <div class="skin-panel">
                <span style="font-size: 13px; color: #ffaa00; font-weight: bold;">SKIN NHÂN VẬT</span>
                <div class="skin-grid">
                    <button class="skin-btn selected" style="border-color: #00ffcc;" onclick="selectSkin('#00ffcc', this)">Cyan</button>
                    <button class="skin-btn" style="border-color: #ff5500;" onclick="selectSkin('#ff5500', this)">Orange</button>
                    <button class="skin-btn" style="border-color: #00ff55;" onclick="selectSkin('#00ff55', this)">Green</button>
                    <button class="skin-btn" style="border-color: #ff0055;" onclick="selectSkin('#ff0055', this)">Red</button>
                </div>
            </div>
        </div>

        <div class="menu-footer">
            <button class="play-btn" onclick="startSelectedLevel()">BẮT ĐẦU CHƠI</button>
            <span style="font-size: 12px; color: #aaa;">Nhấn Play để vào game</span>
        </div>
    </div>

    <!-- KHUNG GAME -->
    <div class="game-container" id="gameContainer">
        <div id="attemptsDisplay">Attempts: 1</div>
        <div class="top-bar">
            <button class="action-btn" onclick="returnToMenu()">🏠 Thoát Menu</button>
        </div>
        <canvas id="gameCanvas" width="850" height="400"></canvas>
    </div>

    <div id="info">Nhấn Space hoặc Click chuột để nhảy</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const infoEl = document.getElementById("info");
        const attemptsDisplay = document.getElementById("attemptsDisplay");
        const menuScreen = document.getElementById("menuScreen");
        const gameContainer = document.getElementById("gameContainer");

        let selectedLevel = 1;
        let playerColor = "#00ffcc";
        let attemptCount = 1;

        function selectSkin(color, btn) {
            playerColor = color;
            document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        const levelGrid = document.getElementById("levelGrid");
        for (let i = 1; i <= 15; i++) {
            let card = document.createElement("div");
            card.className = `level-card ${i === 1 ? 'selected' : ''}`;
            card.innerHTML = `<h4>Màn ${i}</h4><p>Level ${i}</p>`;
            card.onclick = () => {
                document.querySelectorAll('.level-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedLevel = i;
            };
            levelGrid.appendChild(card);
        }

        function returnToMenu() {
            isPlaying = false;
            gameContainer.style.display = "none";
            menuScreen.style.display = "flex";
            infoEl.style.display = "none";
        }

        function startSelectedLevel() {
            menuScreen.style.display = "none";
            gameContainer.style.display = "block";
            infoEl.style.display = "block";
            attemptCount = 1;
            attemptsDisplay.innerText = "Attempts: " + attemptCount;
            startGame();
            gameLoop();
        }

        let gameMode = "cube";
        let isPlaying = false, isGameOver = false, isWon = false;
        let gameSpeed = 7, frameCount = 0;
        let particles = [], shipTrails = [];

        let player = {
            x: 150, y: 300, size: 32, vy: 0, gravity: 0.8, jumpPower: -12, rotation: 0, isGrounded: false,
            scaleX: 1, scaleY: 1
        };

        let objects = [], levelLength = 8000;

        function loadLevelData() {
            objects = [];
            levelLength = 8000 + selectedLevel * 500;
            let cursor = 500;
            while (cursor < levelLength - 500) {
                objects.push({ type: "spike", x: cursor, y: 330, w: 25, h: 35 });
                cursor += 350;
            }
            objects.push({ type: "goal", x: levelLength, y: 0, w: 20, h: 400 });
        }

        let isHolding = false;
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                if (menuScreen.style.display === "flex") return;
                isHolding = true;
                if (!isPlaying && (isGameOver || isWon)) { startGame(); gameLoop(); }
                else if (gameMode === "cube" && player.isGrounded) {
                    player.vy = player.jumpPower; player.isGrounded = false;
                    player.scaleX = 0.7; player.scaleY = 1.3;
                }
                e.preventDefault();
            }
        });
        window.addEventListener("keyup", (e) => { if (e.code === "Space" || e.code === "ArrowUp") isHolding = false; });

        canvas.addEventListener("mousedown", () => {
            if (!isPlaying && (isGameOver || isWon)) { startGame(); gameLoop(); }
            else if (gameMode === "cube" && player.isGrounded) {
                player.vy = player.jumpPower; player.isGrounded = false;
                player.scaleX = 0.7; player.scaleY = 1.3;
            }
        });

        function startGame() {
            isPlaying = true; isGameOver = false; isWon = false;
            frameCount = 0; gameMode = "cube";
            player.y = 300; player.vy = 0; player.rotation = 0;
            particles = []; shipTrails = [];
            loadLevelData();
        }

        function triggerExplosion(x, y) {
            attemptCount++;
            attemptsDisplay.innerText = "Attempts: " + attemptCount;
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 6 + 2, color: playerColor, life: 40
                });
            }
        }

        function update() {
            if (!isPlaying || isGameOver || isWon) return;

            frameCount++;
            player.scaleX += (1 - player.scaleX) * 0.2;
            player.scaleY += (1 - player.scaleY) * 0.2;

            let dist = frameCount * gameSpeed;
            let pct = Math.min(100, Math.floor((dist / levelLength) * 100));
            infoEl.innerText = `Màn ${selectedLevel} | Tiến độ: ${pct}%`;

            player.vy += player.gravity; 
            player.y += player.vy;
            
            if (player.y >= 333) {
                if (!player.isGrounded) { player.scaleX = 1.3; player.scaleY = 0.7; }
                player.y = 333; player.vy = 0; player.isGrounded = true;
                player.rotation = Math.round(player.rotation / 90) * 90;
            } else { 
                player.isGrounded = false; 
                player.rotation += 10; 
            }

            for (let i = 0; i < objects.length; i++) {
                let obj = objects[i];
                obj.x -= gameSpeed;

                if (obj.type === "spike") {
                    if (
                        player.x < obj.x + obj.w - 4 && player.x + player.size > obj.x + 4 &&
                        player.y < obj.y + obj.h - 4 && player.y + player.size > obj.y + 4
                    ) {
                        isGameOver = true;
                        triggerExplosion(player.x + player.size/2, player.y + player.size/2);
                    }
                }
                if (obj.type === "goal" && player.x > obj.x) { 
                    isWon = true; 
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Nền tối chuẩn GD
            ctx.fillStyle = "#111122"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sàn đất
            ctx.fillStyle = "#030308"; 
            ctx.fillRect(0, 365, canvas.width, 35);
            ctx.fillStyle = playerColor; 
            ctx.fillRect(0, 365, canvas.width, 4);

            // Vật thể gai
            objects.forEach(obj => {
                if (obj.type === "spike") {
                    ctx.fillStyle = "#ff0055";
                    ctx.beginPath(); 
                    ctx.moveTo(obj.x, obj.y + obj.h);
                    ctx.lineTo(obj.x + obj.w / 2, obj.y); 
                    ctx.lineTo(obj.x + obj.w, obj.y + obj.h);
                    ctx.closePath(); 
                    ctx.fill();
                }
            });

            // Hiệu ứng hạt nổ
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color; 
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(index, 1);
            });

            // Vẽ nhân vật có khuôn mặt
            if (!isGameOver && !isWon) {
                ctx.save();
                ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                ctx.rotate((player.rotation * Math.PI) / 180);
                ctx.scale(player.scaleX, player.scaleY);

                // Khối vuông
                ctx.fillStyle = playerColor;
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.strokeStyle = "#ffffff"; 
                ctx.lineWidth = 2;
                ctx.strokeRect(-player.size / 2 + 3, -player.size / 2 + 3, player.size - 6, player.size - 6);

                // Mặt nhân vật
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-6, -6, 5, 8); 
                ctx.fillRect(2, -6, 5, 8);
                ctx.fillStyle = "#030308";
                ctx.fillRect(-4, -4, 2, 4);  
                ctx.fillRect(4, -4, 2, 4);   
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-4, 4, 9, 3);

                ctx.restore();
            }

            // Màn hình Game Over
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055"; 
                ctx.font = "bold 40px 'Segoe UI'"; 
                ctx.textAlign = "center";
                ctx.fillText("CRASH!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "white"; 
                ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Nhấn Space để Thử lại", canvas.width / 2, canvas.height / 2 + 25);
            }

            // Màn hình Thắng
            if (isWon) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc"; 
                ctx.font = "bold 40px 'Segoe UI'"; 
                ctx.textAlign = "center";
                ctx.fillText("VICTORY!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "white"; 
                ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Nhấn Space để Chơi lại", canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function gameLoop() {
            if (isPlaying) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
