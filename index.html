<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Stereo Madness (100% Real Style)</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0726;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.4);
            border: 4px solid #1a1540;
            border-radius: 10px;
        }
        canvas {
            display: block;
            background: #190b38;
        }
        .controls {
            margin-top: 15px;
            background: #161138;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #332b70;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="file"] {
            color: #fff;
        }
        .info {
            font-size: 14px;
            color: #a0a0c0;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
    </div>

    <div class="controls">
        <span class="info">🎵 Nhạc nền Stereo Madness (.mp3):</span>
        <input type="file" id="audioUpload" accept="audio/mp3, audio/*">
    </div>

    <audio id="bgMusic" loop></audio>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const audioUpload = document.getElementById("audioUpload");
    const bgMusic = document.getElementById("bgMusic");

    audioUpload.addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (file) {
            bgMusic.src = URL.createObjectURL(file);
            bgMusic.play().catch(() => {});
        }
    });

    // Thông số vật lý chuẩn Geometry Dash
    const GRAVITY = 0.92;
    const JUMP_FORCE = -13.5;
    const GROUND_Y = 390;
    const CUBE_SIZE = 40;
    const SPEED = 6.2;
    const LEVEL_LENGTH = 3800; // Độ dài màn chơi Stereo Madness mẫu

    let player = {
        x: 100,
        y: GROUND_Y - CUBE_SIZE,
        size: CUBE_SIZE,
        vy: 0,
        angle: 0,
        onGround: false
    };

    let cameraX = 0;
    let isGameOver = false;
    let isWon = false;
    let holdingJump = false;
    let particles = [];
    let stars = [];

    // Tạo các ngôi sao nền (Parallax background stars)
    for (let i = 0; i < 60; i++) {
        stars.push({
            x: Math.random() * LEVEL_LENGTH,
            y: Math.random() * GROUND_Y,
            size: Math.random() * 2.5 + 1,
            speed: Math.random() * 0.4 + 0.2
        });
    }

    // Thiết kế màn chơi Stereo Madness chuẩn xác
    let obstacles = [
        { x: 500, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        { x: 750, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        { x: 900, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        { x: 940, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        
        // Cụm khối vuông bậc thang
        { x: 1250, y: GROUND_Y - CUBE_SIZE, type: 'block' },
        { x: 1290, y: GROUND_Y - CUBE_SIZE - CUBE_SIZE, type: 'block' },
        { x: 1330, y: GROUND_Y - CUBE_SIZE - CUBE_SIZE * 2, type: 'block' },
        
        { x: 1650, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        { x: 1690, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        
        { x: 2000, y: GROUND_Y - CUBE_SIZE, type: 'block' },
        { x: 2040, y: GROUND_Y - CUBE_SIZE, type: 'spike' }, // Gai trên bệ block
        { x: 2040, y: GROUND_Y - CUBE_SIZE - CUBE_SIZE, type: 'block' },
        
        { x: 2400, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        { x: 2440, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        { x: 2480, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        
        { x: 2900, y: GROUND_Y - CUBE_SIZE, type: 'block' },
        { x: 2940, y: GROUND_Y - CUBE_SIZE, type: 'block' },
        { x: 3100, y: GROUND_Y - CUBE_SIZE, type: 'spike' },
        { x: 3140, y: GROUND_Y - CUBE_SIZE, type: 'spike' }
    ];

    // Xử lý sự kiện bàn phím & chuột
    window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
            holdingJump = true;
            if (isGameOver || isWon) {
                resetGame();
            } else {
                jump();
            }
        }
    });

    window.addEventListener("keyup", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
            holdingJump = false;
        }
    });

    canvas.addEventListener("mousedown", () => {
        if (isGameOver || isWon) {
            resetGame();
        } else {
            holdingJump = true;
            jump();
        }
    });

    canvas.addEventListener("mouseup", () => {
        holdingJump = false;
    });

    function jump() {
        if (player.onGround) {
            player.vy = JUMP_FORCE;
            player.onGround = false;
            createDustParticles();
        }
    }

    function createDustParticles() {
        for (let i = 0; i < 6; i++) {
            particles.push({
                x: player.x + CUBE_SIZE / 2,
                y: GROUND_Y,
                vx: (Math.random() - 0.5) * 4,
                vy: -Math.random() * 3 - 1,
                size: Math.random() * 4 + 2,
                color: "#64c8ff",
                life: 20
            });
        }
    }

    function createExplosion() {
        for (let i = 0; i < 25; i++) {
            particles.push({
                x: player.x + CUBE_SIZE / 2,
                y: player.y + CUBE_SIZE / 2,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                size: Math.random() * 6 + 3,
                color: Math.random() > 0.5 ? "#ffe600" : "#ff3232",
                life: 40
            });
        }
    }

    function resetGame() {
        player.x = 100;
        player.y = GROUND_Y - CUBE_SIZE;
        player.vy = 0;
        player.angle = 0;
        player.onGround = false;
        cameraX = 0;
        isGameOver = false;
        isWon = false;
        particles = [];
        if (bgMusic.src) {
            bgMusic.currentTime = 0;
            bgMusic.play();
        }
    }

    function update() {
        // Cập nhật hạt hiệu ứng (Particles)
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        if (!isGameOver && !isWon) {
            player.x += SPEED;
            cameraX = player.x - 200;

            player.vy += GRAVITY;
            player.y += player.vy;

            // Chạm đất
            if (player.y + player.size >= GROUND_Y) {
                player.y = GROUND_Y - player.size;
                player.vy = 0;
                player.onGround = true;
                player.angle = Math.round(player.angle / 90) * 90;

                if (holdingJump) {
                    jump();
                }
            } else {
                player.onGround = false;
                player.angle -= 8.5;
            }

            // Kiểm tra va chạm vật thể
            for (let obs of obstacles) {
                let hitBoxX = obs.type === 'spike' ? obs.x + 8 : obs.x;
                let hitBoxY = obs.type === 'spike' ? obs.y + 12 : obs.y;
                let hitBoxW = obs.type === 'spike' ? CUBE_SIZE - 16 : CUBE_SIZE;
                let hitBoxH = obs.type === 'spike' ? CUBE_SIZE - 12 : CUBE_SIZE;

                if (
                    player.x < hitBoxX + hitBoxW &&
                    player.x + player.size > hitBoxX &&
                    player.y < hitBoxY + hitBoxH &&
                    player.y + player.size > hitBoxY
                ) {
                    isGameOver = true;
                    createExplosion();
                    bgMusic.pause();
                }
            }

            // Kiểm tra chiến thắng
            if (player.x > LEVEL_LENGTH) {
                isWon = true;
                bgMusic.pause();
            }
        }
    }

    function draw() {
        // Màu nền Gradient chuẩn Geometry Dash
        let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGradient.addColorStop(0, "#190b38");
        bgGradient.addColorStop(1, "#3c1361");
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Vẽ các ngôi sao chuyển động Parallax
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        for (let star of stars) {
            let drawStarX = (star.x - cameraX * star.speed) % canvas.width;
            if (drawStarX < 0) drawStarX += canvas.width;
            ctx.fillRect(drawStarX, star.y, star.size, star.size);
        }

        // Vẽ lưới nền mờ
        ctx.strokeStyle = "rgba(100, 50, 150, 0.15)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }

        // Vẽ mặt đất Stereo Madness (Xanh dương đặc trưng)
        ctx.fillStyle = "#002080";
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        
        // Họa tiết lưới bên trong mặt đất
        ctx.strokeStyle = "#0040cc";
        ctx.lineWidth = 2;
        for (let x = ( - cameraX * 0.8) % 40; x < canvas.width; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 50, canvas.height);
            ctx.stroke();
        }

        // Viền sáng neon mặt đất
        ctx.strokeStyle = "#00ffff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(canvas.width, GROUND_Y);
        ctx.stroke();

        // Vẽ chướng ngại vật (Gai và Block)
        for (let obs of obstacles) {
            let drawX = obs.x - cameraX;
            if (drawX > -100 && drawX < canvas.width + 100) {
                if (obs.type === 'spike') {
                    ctx.fillStyle = "#ff2222";
                    ctx.beginPath();
                    ctx.moveTo(drawX + CUBE_SIZE / 2, obs.y);
                    ctx.lineTo(drawX, obs.y + CUBE_SIZE);
                    ctx.lineTo(drawX + CUBE_SIZE, obs.y + CUBE_SIZE);
                    ctx.closePath();
                    ctx.fill();
                    // Viền gai
                    ctx.strokeStyle = "#ffa0a0";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (obs.type === 'block') {
                    ctx.fillStyle = "#22bb22";
                    ctx.fillRect(drawX, obs.y, CUBE_SIZE, CUBE_SIZE);
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(drawX, obs.y, CUBE_SIZE, CUBE_SIZE);
                }
            }
        }

        // Vẽ hiệu ứng hạt (Particles & Explosion)
        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
        }

        // Vẽ nhân vật (Cube) khi chưa chết
        if (!isGameOver) {
            ctx.save();
            let playerDrawX = player.x - cameraX;
            ctx.translate(playerDrawX + player.size / 2, player.y + player.size / 2);
            ctx.rotate((player.angle * Math.PI) / 180);

            // Thân khối vuông Vàng Neon
            ctx.fillStyle = "#ffe600";
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
            
            // Viền ngoài và ô vuông nhỏ bên trong chuẩn Game gốc
            ctx.strokeStyle = "#c88c00";
            ctx.lineWidth = 3;
            ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
            
            ctx.fillStyle = "#ff5000";
            ctx.fillRect(-player.size / 4, -player.size / 4, player.size / 2, player.size / 2);
            ctx.restore();
        }

        // --- THANH TIẾN ĐỘ & TÊN LEVEL Ở PHÍA TRÊN (HUD) ---
        let progress = Math.min(100, Math.floor((player.x / LEVEL_LENGTH) * 100));
        
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(canvas.width / 2 - 150, 15, 300, 24);
        ctx.strokeStyle = "#64c8ff";
        ctx.lineWidth = 2;
        ctx.strokeRect(canvas.width / 2 - 150, 15, 300, 24);

        ctx.fillStyle = "#00ff66";
        ctx.fillRect(canvas.width / 2 - 148, 17, (296 * progress) / 100, 20);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`Stereo Madness - ${progress}%`, canvas.width / 2, 31);

        // Hiển thị thông báo Thua / Thắng
        if (isGameOver) {
            ctx.fillStyle = "rgba(15, 10, 40, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff3232";
            ctx.font = "bold 32px Arial";
            ctx.fillText("CRASHED!", canvas.width / 2, canvas.height / 2 - 15);
            ctx.font = "18px Arial";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("Nhấn SPACE hoặc Click để chơi lại", canvas.width / 2, canvas.height / 2 + 25);
        } else if (isWon) {
            ctx.fillStyle = "rgba(15, 10, 40, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#32ff32";
            ctx.font = "bold 32px Arial";
            ctx.fillText("VICTORY!", canvas.width / 2, canvas.height / 2 - 15);
            ctx.font = "18px Arial";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("Bạn đã hoàn thành Stereo Madness!", canvas.width / 2, canvas.height / 2 + 25);
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
