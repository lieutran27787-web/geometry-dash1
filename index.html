<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GROUND_Y = 360;
const CEILING_Y = 40;
let gameState = "START"; 
let score = 0;
let highScore = localStorage.getItem('gd_highscore_v2') || 0;
let bgHue = 260;

let player = {
    x: 120,
    y: GROUND_Y - 30,
    size: 30,
    velocityY: 0,
    gravity: 0.85,
    jumpStrength: -12.5,
    rotation: 0,
    mode: "cube",
    isGrounded: false
};

let particles = [];
let obstacles = [];
let portals = [];
let bgPillars = [];
let frameCount = 0;
let isHolding = false;

for(let i = 0; i < 10; i++) {
    bgPillars.push({
        x: i * 100,
        width: 50,
        height: Math.random() * 150 + 50
    });
}

function jump() {
    if (gameState === "START") {
        gameState = "PLAYING";
    } else if (gameState === "GAMEOVER") {
        resetGame();
    } else if (gameState === "PLAYING") {
        if (player.mode === "cube" && player.isGrounded) {
            player.velocityY = player.jumpStrength;
            player.isGrounded = false;
            createParticles(player.x + 15, player.y + 30, 8, "#00ffcc");
        }
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        if(!isHolding) jump();
        isHolding = true;
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') isHolding = false;
});
canvas.addEventListener('mousedown', () => {
    if(!isHolding) jump();
    isHolding = true;
});
canvas.addEventListener('mouseup', () => isHolding = false);

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            size: Math.random() * 4 + 2,
            life: 20,
            color: color
        });
    }
}

function resetGame() {
    gameState = "PLAYING";
    score = 0;
    obstacles = [];
    portals = [];
