<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Web Clone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: linear-gradient(135deg, #0055ff, #002288);
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            overflow: hidden;
            border-radius: 8px;
        }
        canvas {
            display: block;
            background: #112244;
        }
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }
        h1 {
            font-size: 42px;
            color: #00ffcc;
            text-shadow: 2px 2px #ff00ff, 0 0 10px #00ffcc;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            background: linear-gradient(to bottom, #72ff52, #2da815);
            border: 3px solid #ffffff;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 36px;
            border-radius: 25px;
            cursor: pointer;
            text-shadow: 1px 1px #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin: 10px;
            transition: 0.1s;
        }
        .btn:hover {
            transform: scale(1.05);
            background: linear-gradient(to bottom, #8aff6c, #35be1a);
        }
        .btn:active {
            transform: scale(0.95);
        }
        #ui-overlay {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 1px 1px 2px #000;
            z-index: 5;
        }
        .progress-bar-container {
            width: 500px;
            height: 14px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-radius: 7px;
            overflow: hidden;
            margin: 0 auto;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #72ff52);
            transition: width 0.1s linear;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Màn hình chính (Menu) -->
    <div id="main-menu" class="screen">
        <h1>STEREO MADNESS</h1>
        <p style="margin-bottom: 20px; color: #aaddff; font-size: 16px;">Nhấn Space / Click chuột để nhảy qua chướng ngại vật!</p>
        <button class="btn" onclick="startGame()">CHƠI NGAY</button>
    </div>

    <!-- Màn hình Game Over / Thắng -->
    <div id="game-over-screen" class="screen hidden">
        <h1 id="result-title">THẤT BẠI</h1>
        <p id="result-score" style="margin-bottom: 20px; font-size: 18px;">Hoàn thành: 0%</p>
        <button class="btn" onclick="startGame()">THỬ LẠI</button>
        <button class="btn" style="background: linear-gradient(to bottom, #ff5252, #a81515);" onclick="returnToMenu()">MENU</button>
    </div>

    <!-- Giao diện trong game -->
    <div id="ui-overlay" class="hidden">
        <div>Màn: <span id="level-name">Stereo Madness</span></div>
        <div style="flex-grow: 1; text-align: center;">
            <div class="progress-bar-container">
                <div id="progress" class="progress-bar"></div>
            </div>
        </div>
        <div>Lần thử: <span id="attempts">1</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
let attempts = 1;
let score = 0;
let gameSpeed = 6;
let levelLength = 5000; // Độ dài màn chơi pixels
let cameraX = 0;

// Cấu hình nhân vật hình vuông (Cube)
const player = {
    x: 150,
    y: 300,
    size: 32,
    vy: 0,
    gravity: 0.8,
    jumpForce: -12.5,
    rotation: 0,
    isGrounded: false
};

// Bản đồ chướng ngại vật (Gai: spike, Khối vuông: block)
const obstacles = [];

function generateLevel() {
    obstacles.length = 0;
    let currentX = 600;
    while (currentX < levelLength - 400) {
        let type = Math.random();
        if (type < 0.4) {
            // Đơn gai
            obstacles.push({ x: currentX, y: 350, w: 32, h: 32, type: 'spike' });
            currentX += 180 + Math.random() * 100;
        } else if (type < 0.7) {
            // Cụm 2 gai
            obstacles.push({ x: currentX, y: 350, w: 32, h: 32, type: 'spike' });
            obstacles.push({ x: currentX + 32, y: 350, w: 32, h: 32, type: 'spike' });
            currentX += 280 + Math.random() * 100;
        } else {
            // Bục khối vuông có thể nhảy lên
            let blockH = 64;
            obstacles.push({ x: currentX, y: 382 - blockH, w: 64, h: blockH, type: 'block' });
            // Đặt gai trên bục hoặc nhảy qua khoảng trống
            if (Math.random() > 0.5) {
                obstacles.push({ x: currentX + 16, y: 382 - blockH - 32, w: 32, h: 32, type: 'spike' });
            }
            currentX += 320 + Math.random() * 120;
        }
    }
}

function startGame() {
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('ui-overlay').classList.remove('hidden');

    player.x = 150;
    player.y = 300;
    player.vy = 0;
    player.rotation = 0;
    cameraX = 0;
    gameSpeed = 6;
    
    generateLevel();
    gameState = 'PLAYING';
}

function returnToMenu() {
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
    document.getElementById('ui-overlay').classList.add('hidden');
    gameState = 'MENU';
}

function gameOver() {
    gameState = 'GAMEOVER';
    attempts++;
    document.getElementById('attempts').innerText = attempts;
    document.getElementById('result-title').innerText = 'THẤT BẠI';
    document.getElementById('result-title').style.color = '#ff5252';
    document.getElementById('result-score').innerText = `Hoàn thành: ${Math.floor(score)}%`;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

function gameWin() {
    gameState = 'GAMEOVER';
    document.getElementById('result-title').innerText = 'HOÀN THÀNH!';
    document.getElementById('result-title').style.color = '#72ff52';
    document.getElementById('result-score').innerText = `Hoàn thành: 100%`;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

// Xử lý phím bấm & tương tác
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
    }
});

canvas.addEventListener('mousedown', () => {
    jump();
});

function jump() {
    if (gameState === 'PLAYING' && player.isGrounded) {
        player.vy = player.jumpForce;
        player.isGrounded = false;
    }
}

// Vòng lặp cập nhật trò chơi
function update() {
    if (gameState !== 'PLAYING') return;

    // Di chuyển màn hình & nhân vật
    cameraX += gameSpeed;
    player.vy += player.gravity;
    player.y += player.vy;

    score = Math.min(100, (cameraX / levelLength) * 100);
    document.getElementById('progress').style.width = score + '%';

    if (cameraX >= levelLength) {
        gameWin();
        return;
    }

    // Va chạm mặt đất (y = 382 là sàn, nhân vật cao 32 -> y_ground = 382 - 32 = 350)
    let groundY = 382 - player.size;
    player.isGrounded = false;

    // Kiểm tra va chạm với các khối vuông (block) và sàn
    if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.isGrounded = true;
        // Snap góc xoay về bội số gần nhất của 90 độ khi chạm đất
        player.rotation = Math.round(player.rotation / 90) * 90;
    }

    // Xử lý va chạm chướng ngại vật
    let pBox = {
        x: player.x + 4,
        y: player.y + 4,
        w: player.size - 8,
        h: player.size - 8
    };

    for (let obs of obstacles) {
        let screenObsX = obs.x - cameraX;
        // Chỉ kiểm tra chướng ngại vật trong khung hình
        if (screenObsX > -100 && screenObsX < canvas.width + 100) {
            let oBox = { x: screenObsX, y: obs.y, w: obs.w, h: obs.h };

            // Kiểm tra va chạm hộp (AABB)
            if (pBox.x < oBox.x + oBox.w &&
                pBox.x + pBox.w > oBox.x &&
                pBox.y < oBox.y + oBox.h &&
                pBox.y + pBox.h > oBox.y) {
                
                if (obs.type === 'spike') {
                    gameOver();
                } else if (obs.type === 'block') {
                    // Xử lý va chạm từ trên xuống khối block
                    let prevY = player.y - player.vy;
                    if (prevY + player.size <= obs.y + 10 && player.vy >= 0) {
                        player.y = obs.y - player.size;
                        player.vy = 0;
                        player.isGrounded = true;
                        player.rotation = Math.round(player.rotation / 90) * 90;
                    } else {
                        // Đâm ngang vào block -> Thua
                        gameOver();
                    }
                }
            }
        }
    }

    // Xoay nhân vật khi bay/nhảy
    if (!player.isGrounded) {
        player.rotation += 8;
    }
}

// Vẽ đồ họa game
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ nền trời / gradient phong cách Geometry Dash
    let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#0055ff');
    bgGrad.addColorStop(1, '#002288');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Vẽ các đường lưới nền mờ
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    let gridSize = 40;
    let offsetX = -(cameraX % gridSize);
    for (let x = offsetX; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    // Vẽ chướng ngại vật
    for (let obs of obstacles) {
        let screenX = obs.x - cameraX;
        if (screenX > -100 && screenX < canvas.width + 100) {
            if (obs.type === 'spike') {
                // Vẽ hình tam giác gai màu đen viền sáng
                ctx.fillStyle = '#111111';
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(screenX, obs.y + obs.h);
                ctx.lineTo(screenX + obs.w / 2, obs.y);
                ctx.lineTo(screenX + obs.w, obs.y + obs.h);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (obs.type === 'block') {
                // Vẽ khối vuông
                ctx.fillStyle = '#003366';
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.fillRect(screenX, obs.y, obs.w, obs.h);
                ctx.strokeRect(screenX, obs.y, obs.w, obs.h);
                
                // Chi tiết trang trí bên trong khối
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(screenX + 8, obs.y + 8, obs.w - 16, obs.h - 16);
            }
        }
    }

    // Vẽ sàn nhà (Ground) ở dưới đáy
    let groundY = 382;
    ctx.fillStyle = '#00aa55';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    
    // Đường viền sàn phát sáng
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();

    // Họa tiết khối nhỏ dọc biên sàn
    ctx.fillStyle = '#00ff88';
    let floorGridSize = 32;
    let floorOffsetX = -(cameraX % floorGridSize);
    for (let x = floorOffsetX; x < canvas.width; x += floorGridSize) {
        ctx.fillRect(x, groundY + 4, floorGridSize - 4, 12);
    }

    // Vẽ nhân vật hình vuông (Player Cube) giống giao diện chọn icon trong ảnh
    ctx.save();
    ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
    ctx.rotate((player.rotation * Math.PI) / 180);

    // Thân khối vuông màu xanh lá sáng với viền đậm
    ctx.fillStyle = '#72ff52';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
    ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);

    // Chi tiết ô vuông nhỏ bên trong giống ảnh nhân vật chính
    ctx.fillStyle = '#0055ff';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    let innerSize = 14;
    ctx.fillRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize);
    ctx.strokeRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize);

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Bắt đầu vòng lặp render
loop();
</script>

</body>
</html>
