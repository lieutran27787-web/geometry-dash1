<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Polargeist Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: linear-gradient(135deg, #0055ff, #001e66);
            border: 4px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
            overflow: hidden;
            border-radius: 8px;
        }
        canvas {
            display: block;
            background: #112244;
        }
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.88);
            z-index: 10;
        }
        .hidden { display: none !important; }

        /* 1. Màn hình mở đầu giống ảnh 3 (Level Select / How to Change) */
        #level-select-screen {
            background: linear-gradient(180deg, #0033cc, #001144);
            padding: 20px;
        }
        .top-banner {
            background: #002277;
            border: 3px solid #00ffcc;
            border-radius: 12px;
            padding: 10px 40px;
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px #000;
            margin-bottom: 15px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,255,204,0.3);
        }
        .sub-banner {
            background: #001a55;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            width: 500px;
            text-align: center;
            padding: 10px;
            font-size: 18px;
            color: #72ff52;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .level-nav-buttons {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-bottom: 25px;
        }
        .circle-btn {
            width: 65px;
            height: 65px;
            background: linear-gradient(to bottom, #72ff52, #1b8a10);
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            transition: 0.1s;
        }
        .circle-btn:hover { transform: scale(1.1); background: linear-gradient(to bottom, #8aff6c, #25a117); }
        .circle-btn:active { transform: scale(0.95); }
        .play-big-btn {
            width: 85px;
            height: 85px;
            background: linear-gradient(to bottom, #72ff52, #1b8a10);
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: 0.1s;
        }
        .play-big-btn:hover { transform: scale(1.08); }
        .level-info-bar {
            display: flex;
            gap: 30px;
            font-size: 15px;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 1px 1px #000;
        }
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(to bottom, #72ff52, #1b8a10);
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .skin-shop-icon-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: linear-gradient(to bottom, #ff9800, #e65100);
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 2. Màn hình chọn Skin giống ảnh 1 (Icon Kit) */
        #skin-screen {
            background: linear-gradient(180deg, #333333, #111111);
            padding: 20px;
        }
        .skin-panel {
            background: #222222;
            border: 4px solid #555555;
            border-radius: 12px;
            width: 650px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }
        .preview-box {
            width: 70px;
            height: 70px;
            background: #111;
            border: 3px solid #00ffcc;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .skin-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            background: #151515;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #444;
            max-height: 200px;
            overflow-y: auto;
        }
        .skin-item {
            width: 50px;
            height: 50px;
            background: #2a2a2a;
            border: 2px solid #666;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.1s;
        }
        .skin-item:hover { border-color: #00ffcc; transform: scale(1.05); }
        .skin-item.selected { border-color: #72ff52; background: #335533; box-shadow: 0 0 10px #72ff52; }

        /* 3. Màn hình Polargeist Stats giống ảnh 4 */
        #polargeist-stats-screen {
            background: rgba(0,0,0,0.92);
        }
        .stats-box {
            background: linear-gradient(180deg, #007744, #003322);
            border: 4px solid #72ff52;
            border-radius: 12px;
            width: 500px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 25px rgba(114,255,82,0.4);
            position: relative;
        }
        .stats-title {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px #000;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .progress-indicator-line {
            background: #111;
            border: 2px solid #fff;
            height: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill-green {
            background: #72ff52;
            width: 100%;
            height: 100%;
        }
        .stats-buttons-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* 4. Giao diện trong game (UI Overlay) */
        #ui-overlay {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 2px #000;
            z-index: 5;
        }
        .progress-bar-container {
            width: 450px;
            height: 14px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #fff;
            border-radius: 7px;
            overflow: hidden;
            margin: 0 auto;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #72ff52);
            transition: width 0.1s linear;
        }
        .btn-common {
            background: linear-gradient(to bottom, #72ff52, #1b8a10);
            border: 3px solid #fff;
            color: #fff;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.1s;
        }
        .btn-common:hover { transform: scale(1.05); background: linear-gradient(to bottom, #8aff6c, #25a117); }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 1. Màn hình mở đầu giống ảnh 3 (Level Select / Polargeist) -->
    <div id="level-select-screen" class="screen">
        <div class="back-arrow" onclick="openPolargeistStats()" title="Xem thông số Polargeist (giống ảnh 4)">ℹ️</div>
        <div class="skin-shop-icon-btn" onclick="openSkinShop()" title="Chọn Skin (giống ảnh 1)">🎨</div>

        <div class="top-banner">POLARGEIST</div>
        <div class="sub-banner">background color 2.1</div>

        <div class="level-nav-buttons">
            <div class="circle-btn" onclick="openPolargeistStats()" style="font-size: 24px;">🛠️</div>
            <div class="play-big-btn" onclick="startGame()">
                <span style="font-size: 42px; color: #fff; padding-left: 6px;">▶</span>
            </div>
            <div class="circle-btn" onclick="openPolargeistStats()" style="font-size: 24px;">📤</div>
        </div>

        <div class="level-info-bar">
            <div>⏱️ TINY</div>
            <div>🎵 POLARGEIST</div>
            <div>⭐ UNVERIFIED</div>
        </div>
    </div>

    <!-- 2. Màn hình Kho Skin giống ảnh 1 (Icon Kit) -->
    <div id="skin-screen" class="screen hidden">
        <div class="skin-panel">
            <div class="back-arrow" style="top: 15px; left: 15px; width: 40px; height: 40px; font-size: 18px;" onclick="closeSkinShop()">◄</div>
            <h2 style="color: #ffeb3b; margin-bottom: 15px; text-shadow: 1px 1px #000;">ICON KIT - CHỌN SKIN NHÂN VẬT</h2>
            
            <div class="preview-box" id="skin-preview">
                <!-- Preview nhân vật -->
            </div>

            <div class="skin-grid" id="skin-grid-container">
                <!-- Các skin sẽ được sinh tự động bằng JS -->
            </div>
        </div>
    </div>

    <!-- 3. Màn hình Thông số Polargeist giống ảnh 4 -->
    <div id="polargeist-stats-screen" class="screen hidden">
        <div class="stats-box">
            <div class="back-arrow" style="top: 15px; left: 15px; width: 40px; height: 40px; font-size: 18px;" onclick="closePolargeistStats()">◄</div>
            <div class="stats-title">POLARGEIST</div>
            <p style="color: #aaddff; font-size: 14px; margin-bottom: 8px;">NORMAL MODE</p>
            <div class="progress-indicator-line">
                <div class="progress-fill-green" style="width: 100%;"></div>
            </div>
            <p style="color: #aaddff; font-size: 14px; margin-bottom: 8px;">PRACTICE MODE</p>
            <div class="progress-indicator-line">
                <div class="progress-fill-green" style="width: 6%;"></div>
            </div>

            <div class="stats-buttons-row">
                <button class="circle-btn" style="width: 55px; height: 55px; font-size: 22px;" onclick="startGame()">▶</button>
                <button class="circle-btn" style="width: 55px; height: 55px; font-size: 22px; background: linear-gradient(to bottom, #ff9800, #e65100);" onclick="closePolargeistStats()">📋</button>
                <button class="circle-btn" style="width: 55px; height: 55px; font-size: 22px; background: linear-gradient(to bottom, #03a9f4, #01579b);" onclick="startGame()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 4. Màn hình Thua / Thắng -->
    <div id="game-over-screen" class="screen hidden">
        <h1 id="result-title" style="font-size: 38px; color: #ff5252;">THẤT BẠI</h1>
        <p id="result-score" style="margin-bottom: 20px; font-size: 18px;">Hoàn thành: 0%</p>
        <div style="display: flex; gap: 15px;">
            <button class="btn-common" onclick="startGame()">THỬ LẠI</button>
            <button class="btn-common" style="background: linear-gradient(to bottom, #ff5252, #c62828);" onclick="returnToMenu()">MENU</button>
        </div>
    </div>

    <!-- 5. Giao diện trong game -->
    <div id="ui-overlay" class="hidden">
        <div>Màn: <span id="level-name" style="color: #72ff52;">POLARGEIST</span></div>
        <div style="flex-grow: 1; text-align: center;">
            <div class="progress-bar-container">
                <div id="progress" class="progress-bar"></div>
            </div>
        </div>
        <div>Thử: <span id="attempts">1</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU'; // MENU, SKIN, STATS, PLAYING, GAMEOVER
let attempts = 1;
let score = 0;
let gameSpeed = 6.5;
let levelLength = 6000;
let cameraX = 0;

// Hệ thống Skin nhân vật phong phú giống ảnh 1
const skins = [
    { id: 0, primary: '#72ff52', secondary: '#0055ff', unlocked: true },
    { id: 1, primary: '#ff5252', secondary: '#ffeb3b', unlocked: true },
    { id: 2, primary: '#00ffff', secondary: '#002b88', unlocked: true },
    { id: 3, primary: '#ff00ff', secondary: '#550055', unlocked: true },
    { id: 4, primary: '#ffeb3b', secondary: '#ff5722', unlocked: true },
    { id: 5, primary: '#ffffff', secondary: '#333333', unlocked: true },
    { id: 6, primary: '#9c27b0', secondary: '#e91e63', unlocked: true },
    { id: 7, primary: '#795548', secondary: '#ffccbc', unlocked: true },
];
let currentSkinIndex = 0;

const player = {
    x: 150,
    y: 300,
    size: 32,
    vy: 0,
    gravity: 0.85,
    jumpForce: -13,
    rotation: 0,
    isGrounded: false
};

const obstacles = [];

function generateLevel() {
    obstacles.length = 0;
    let currentX = 600;
    while (currentX < levelLength - 400) {
        let type = Math.random();
        if (type < 0.35) {
            obstacles.push({ x: currentX, y: 350, w: 32, h: 32, type: 'spike' });
            currentX += 170 + Math.random() * 80;
        } else if (type < 0.65) {
            obstacles.push({ x: currentX, y: 350, w: 32, h: 32, type: 'spike' });
            obstacles.push({ x: currentX + 30, y: 350, w: 32, h: 32, type: 'spike' });
            currentX += 260 + Math.random() * 100;
        } else {
            let blockH = 64;
            obstacles.push({ x: currentX, y: 382 - blockH, w: 64, h: blockH, type: 'block' });
            if (Math.random() > 0.4) {
                obstacles.push({ x: currentX + 16, y: 382 - blockH - 32, w: 32, h: 32, type: 'spike' });
            }
            currentX += 300 + Math.random() * 120;
        }
    }
}

// Khởi tạo danh sách skin trong giao diện Kho Skin
function initSkinShop() {
    const container = document.getElementById('skin-grid-container');
    container.innerHTML = '';
    skins.forEach((skin, idx) => {
        let item = document.createElement('div');
        item.className = `skin-item ${idx === currentSkinIndex ? 'selected' : ''}`;
        item.innerHTML = `<div style="width:24px; height:24px; background:${skin.primary}; border:2px solid #000; position:relative; display:flex; justify-content:center; align-items:center;">
            <div style="width:10px; height:10px; background:${skin.secondary}; border:1px solid #fff;"></div>
        </div>`;
        item.onclick = () => {
            currentSkinIndex = idx;
            updateSkinPreview();
            initSkinShop();
        };
        container.appendChild(item);
    });
    updateSkinPreview();
}

function updateSkinPreview() {
    const preview = document.getElementById('skin-preview');
    let skin = skins[currentSkinIndex];
    preview.innerHTML = `<div style="width:36px; height:36px; background:${skin.primary}; border:3px solid #000; position:relative; display:flex; justify-content:center; align-items:center;">
        <div style="width:14px; height:14px; background:${skin.secondary}; border:1.5px solid #fff;"></div>
    </div>`;
}

function openSkinShop() {
    document.getElementById('level-select-screen').classList.add('hidden');
    document.getElementById('skin-screen').classList.remove('hidden');
    initSkinShop();
}

function closeSkinShop() {
    document.getElementById('skin-screen').classList.add('hidden');
    document.getElementById('level-select-screen').classList.remove('hidden');
}

function openPolargeistStats() {
    document.getElementById('level-select-screen').classList.add('hidden');
    document.getElementById('polargeist-stats-screen').classList.remove('hidden');
}

function closePolargeistStats() {
    document.getElementById('polargeist-stats-screen').classList.add('hidden');
    document.getElementById('level-select-screen').classList.remove('hidden');
}

function startGame() {
    document.getElementById('level-select-screen').classList.add('hidden');
    document.getElementById('skin-screen').classList.add('hidden');
    document.getElementById('polargeist-stats-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('ui-overlay').classList.remove('hidden');

    player.x = 150;
    player.y = 300;
    player.vy = 0;
    player.rotation = 0;
    cameraX = 0;
    
    generateLevel();
    gameState = 'PLAYING';
}

function returnToMenu() {
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('ui-overlay').classList.add('hidden');
    document.getElementById('level-select-screen').classList.remove('hidden');
    gameState = 'MENU';
}

function gameOver() {
    gameState = 'GAMEOVER';
    attempts++;
    document.getElementById('attempts').innerText = attempts;
    document.getElementById('result-title').innerText = 'THẤT BẠI';
    document.getElementById('result-title').style.color = '#ff5252';
    document.getElementById('result-score').innerText = `Hoàn thành: ${Math.floor(score)}%`;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

function gameWin() {
    gameState = 'GAMEOVER';
    document.getElementById('result-title').innerText = 'HOÀN THÀNH POLARGEIST!';
    document.getElementById('result-title').style.color = '#72ff52';
    document.getElementById('result-score').innerText = `Hoàn thành: 100%`;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
    }
});

canvas.addEventListener('mousedown', () => {
    jump();
});

function jump() {
    if (gameState === 'PLAYING' && player.isGrounded) {
        player.vy = player.jumpForce;
        player.isGrounded = false;
    }
}

function update() {
    if (gameState !== 'PLAYING') return;

    cameraX += gameSpeed;
    player.vy += player.gravity;
    player.y += player.vy;

    score = Math.min(100, (cameraX / levelLength) * 100);
    document.getElementById('progress').style.width = score + '%';

    if (cameraX >= levelLength) {
        gameWin();
        return;
    }

    let groundY = 382 - player.size;
    player.isGrounded = false;

    if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.isGrounded = true;
        player.rotation = Math.round(player.rotation / 90) * 90;
    }

    let pBox = { x: player.x + 4, y: player.y + 4, w: player.size - 8, h: player.size - 8 };

    for (let obs of obstacles) {
        let screenObsX = obs.x - cameraX;
        if (screenObsX > -100 && screenObsX < canvas.width + 100) {
            let oBox = { x: screenObsX, y: obs.y, w: obs.w, h: obs.h };

            if (pBox.x < oBox.x + oBox.w &&
                pBox.x + pBox.w > oBox.x &&
                pBox.y < oBox.y + oBox.h &&
                pBox.y + pBox.h > oBox.y) {
                
                if (obs.type === 'spike') {
                    gameOver();
                } else if (obs.type === 'block') {
                    let prevY = player.y - player.vy;
                    if (prevY + player.size <= obs.y + 10 && player.vy >= 0) {
                        player.y = obs.y - player.size;
                        player.vy = 0;
                        player.isGrounded = true;
                        player.rotation = Math.round(player.rotation / 90) * 90;
                    } else {
                        gameOver();
                    }
                }
            }
        }
    }

    if (!player.isGrounded) {
        player.rotation += 9;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#0033aa');
    bgGrad.addColorStop(1, '#001133');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;
    let gridSize = 40;
    let offsetX = -(cameraX % gridSize);
    for (let x = offsetX; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    for (let obs of obstacles) {
        let screenX = obs.x - cameraX;
        if (screenX > -100 && screenX < canvas.width + 100) {
            if (obs.type === 'spike') {
                ctx.fillStyle = '#111111';
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(screenX, obs.y + obs.h);
                ctx.lineTo(screenX + obs.w / 2, obs.y);
                ctx.lineTo(screenX + obs.w, obs.y + obs.h);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (obs.type === 'block') {
                ctx.fillStyle = '#002244';
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.fillRect(screenX, obs.y, obs.w, obs.h);
                ctx.strokeRect(screenX, obs.y, obs.w, obs.h);
                
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(screenX + 8, obs.y + 8, obs.w - 16, obs.h - 16);
            }
        }
    }

    let groundY = 382;
    ctx.fillStyle = '#008844';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();

    ctx.fillStyle = '#00cc66';
    let floorGridSize = 32;
    let floorOffsetX = -(cameraX % floorGridSize);
    for (let x = floorOffsetX; x < canvas.width; x += floorGridSize) {
        ctx.fillRect(x, groundY + 4, floorGridSize - 4, 12);
    }

    // Vẽ nhân vật với màu sắc theo Skin đã chọn trong Kho Skin (Ảnh 1)
    let skin = skins[currentSkinIndex];
    ctx.save();
    ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
    ctx.rotate((player.rotation * Math.PI) / 180);

    ctx.fillStyle = skin.primary;
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
    ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);

    ctx.fillStyle = skin.secondary;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    let innerSize = 14;
    ctx.fillRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize);
    ctx.strokeRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize);

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
