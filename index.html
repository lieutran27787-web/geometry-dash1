<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Lite - 16 Levels</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Fredoka One', cursive, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        #game-container {
            width: 900px;
            height: 500px;
            background: #0055ff;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 4px solid #002288;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(135deg, #0033cc 0%, #001144 100%);
        }

        /* UI Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 50, 0.85);
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        h1.title {
            font-size: 52px;
            color: #55ff00;
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000, 0px 6px 15px rgba(85,255,0,0.5);
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 2px;
        }

        .btn {
            background: #55ff00;
            color: #000;
            border: 4px solid #fff;
            padding: 12px 35px;
            font-size: 24px;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            border-radius: 18px;
            box-shadow: 0 6px 0 #228800, 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            margin: 10px;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #77ff33;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #228800, 0 5px 10px rgba(0,0,0,0.5);
        }

        .btn-secondary {
            background: #00ffff;
            box-shadow: 0 6px 0 #008888;
        }
        .btn-secondary:hover { background: #33ffff; }

        /* Level Selector Grid (16 Levels) */
        #level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-height: 320px;
            overflow-y: auto;
            padding: 15px;
            width: 80%;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 2px solid #00ffff;
        }

        .level-card {
            background: #002266;
            border: 3px solid #00ffff;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #0044aa;
        }

        .level-card:hover {
            background: #0044aa;
            transform: scale(1.05);
        }

        .level-card h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #55ff00;
        }

        .level-card p {
            margin: 0;
            font-size: 12px;
            color: #ccc;
        }

        /* HUD trong game */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .hud-btn {
            background: rgba(0,0,0,0.5);
            border: 2px solid white;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }
        .hud-btn:hover { background: rgba(255,255,255,0.3); }

        #progress-container {
            width: 400px;
            height: 14px;
            background: rgba(0,0,0,0.5);
            border: 2px solid white;
            border-radius: 7px;
            overflow: hidden;
            position: relative;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #55ff00;
            transition: width 0.1s linear;
        }

        #attempt-display {
            position: absolute;
            top: 70px;
            left: 30px;
            font-size: 26px;
            color: white;
            text-shadow: 2px 2px 0 #000;
            display: none;
        }

        /* Custom Music & Character panels */
        .panel {
            background: rgba(0,0,40,0.95);
            border: 4px solid #55ff00;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            width: 500px;
        }

        input[type="file"] {
            margin: 15px 0;
            color: white;
            font-family: 'Fredoka One';
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- MÀN HÌNH CHÍNH (MENU) -->
    <div id="main-menu" class="screen">
        <h1 class="title">GEOMETRY DASH LITE</h1>
        <div style="display: flex; gap: 20px; align-items: center;">
            <button class="btn" onclick="openLevelSelect()">CHƠI NGAY (PLAY)</button>
            <button class="btn btn-secondary" onclick="openCharacterSelect()">ĐỔI NHÂN VẬT</button>
        </div>
        <div style="margin-top: 15px; display: flex; gap: 15px;">
            <button class="btn" style="font-size: 16px; padding: 8px 20px;" onclick="openMusicPanel()">🎵 TÙY CHỈNH NHẠC</button>
        </div>
    </div>

    <!-- MÀN HÌNH CHỌN 16 MÃN CHƠI -->
    <div id="level-screen" class="screen hidden">
        <h1 class="title" style="font-size: 36px; margin-bottom: 15px;">CHỌN MÀN CHƠI (16 LEVELS)</h1>
        <div id="level-grid"></div>
        <button class="btn" style="margin-top: 15px; font-size: 18px; padding: 8px 25px;" onclick="backToMenu()">QUAY LẠI</button>
    </div>

    <!-- MÀN HÌNH CHỌN NHÂN VẬT -->
    <div id="char-screen" class="screen hidden">
        <div class="panel">
            <h2 style="color: #55ff00; margin-top: 0;">CHỌN MÀU & HÌNH DẠNG</h2>
            <div style="display: flex; justify-content: center; gap: 15px; margin: 20px 0;">
                <div onclick="selectColor('#55ff00')" style="width: 40px; height: 40px; background: #55ff00; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
                <div onclick="selectColor('#ff3333')" style="width: 40px; height: 40px; background: #ff3333; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
                <div onclick="selectColor('#00ffff')" style="width: 40px; height: 40px; background: #00ffff; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
                <div onclick="selectColor('#ffff00')" style="width: 40px; height: 40px; background: #ffff00; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
                <div onclick="selectColor('#ff00ff')" style="width: 40px; height: 40px; background: #ff00ff; border: 3px solid #fff; cursor: pointer; border-radius: 8px;"></div>
            </div>
            <button class="btn" onclick="backToMenu()">XÁC NHẬN</button>
        </div>
    </div>

    <!-- MÀN HÌNH THÊM NHẠC TÙY THÍCH -->
    <div id="music-screen" class="screen hidden">
        <div class="panel">
            <h2 style="color: #00ffff; margin-top: 0;">THÊM NHẠC TÙY THÍCH</h2>
            <p style="font-size: 14px; color: #ccc;">Tải file nhạc (.mp3, .wav) từ máy tính của bạn:</p>
            <input type="file" id="custom-audio-input" accept="audio/*" onchange="loadCustomMusic(event)"><br>
            <p id="music-status" style="font-size: 14px; color: #55ff00;"></p>
            <button class="btn" onclick="backToMenu()">XONG</button>
        </div>
    </div>

    <!-- KHU VỰC GAME CHÍNH -->
    <div id="game-screen" class="screen hidden" style="background: transparent;">
        <div id="hud">
            <button class="hud-btn" onclick="pauseGame()">⏸</button>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <button class="hud-btn" onclick="togglePracticeMode()" id="practice-btn" title="Chế độ tập luyện (Checkpoint)">🛡️</button>
        </div>
        <div id="attempt-display">ATTEMPT 1</div>
        <canvas id="gameCanvas" width="900" height="500"></canvas>
    </div>

    <!-- BẢNG TẠM DỪNG (PAUSE) -->
    <div id="pause-screen" class="screen hidden">
        <div class="panel">
            <h2 style="color: #ffff00;">TẠM DỪNG</h2>
            <button class="btn" onclick="resumeGame()">TIẾP TỤC</button><br>
            <button class="btn btn-secondary" onclick="restartLevel()">CHƠI LẠI</button><br>
            <button class="btn" style="background: #ff3333; color: white;" onclick="exitToMenu()">THOÁT RA MENU</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentScreen = "main-menu";
    let selectedLevel = 1;
    let playerColor = "#55ff00";
    let isPaused = false;
    let attemptCount = 1;
    let practiceMode = false;
    let checkpoints = [];

    // Cấu hình âm thanh & nhạc tùy chỉnh
    let customAudio = null;
    let backgroundMusic = new Audio();

    function loadCustomMusic(event) {
        const file = event.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            backgroundMusic.src = url;
            backgroundMusic.loop = true;
            document.getElementById("music-status").innerText = "Đã tải nhạc thành công: " + file.name;
        }
    }

    // Tạo danh sách 16 màn chơi tự động với độ khó tăng dần
    const levelGrid = document.getElementById("level-grid");
    const levelData = [];
    const levelNames = [
        "Stereo Madness", "Back On Track", "Polargeist", "Dry Out",
        "Base After Base", "Can't Let Go", "Jumper", "Time Machine",
        "Cycles", "xStep", "Clutterfunk", "Theory of Everything",
        "Electroman Adventures", "Clubstep", "Electrodynamix", "Fingerdash"
    ];

    for (let i = 1; i <= 16; i++) {
        levelData.push({ id: i, name: levelNames[i-1], length: 3000 + i * 400 });
        const card = document.createElement("div");
        card.className = "level-card";
        card.innerHTML = `<h3>${i}. ${levelNames[i-1]}</h3><p>Độ khó: ${Math.min(10, Math.ceil(i/1.5))}★</p>`;
        card.onclick = () => startLevel(i);
        levelGrid.appendChild(card);
    }

    // Chuyển đổi màn hình UI
    function showScreen(screenId) {
        document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
        document.getElementById(screenId).classList.remove("hidden");
        currentScreen = screenId;
    }

    function openLevelSelect() { showScreen("level-screen"); }
    function openCharacterSelect() { showScreen("char-screen"); }
    function openMusicPanel() { showScreen("music-screen"); }
    function backToMenu() { showScreen("main-menu"); if(backgroundMusic) backgroundMusic.pause(); }
    function selectColor(color) { playerColor = color; }

    // Biến trạng thái trò chơi
    let player = {
        x: 150, y: 350, size: 35, vy: 0, gravity: 0.9, jumpForce: -14,
        rotation: 0, grounded: false
    };
    let obstacles = [];
    let particles = [];
    let gameProgress = 0;
    let currentLevelConfig = null;

    function startLevel(levelId) {
        selectedLevel = levelId;
        currentLevelConfig = levelData[levelId - 1];
        showScreen("game-screen");
        attemptCount = 1;
        resetPlayerAndLevel();
        if (backgroundMusic.src) {
            backgroundMusic.currentTime = 0;
            backgroundMusic.play().catch(e => console.log("Audio autoplay restricted"));
        }
    }

    function resetPlayerAndLevel() {
        player.x = 150;
        player.y = 350;
        player.vy = 0;
        player.rotation = 0;
        player.grounded = false;
        gameProgress = 0;
        isPaused = false;
        document.getElementById("pause-screen").classList.add("hidden");
        document.getElementById("attempt-display").innerText = "ATTEMPT " + attemptCount;
        document.getElementById("attempt-display").style.display = "block";
        setTimeout(() => { document.getElementById("attempt-display").style.display = "none"; }, 1500);

        // Sinh chướng ngại vật (Gai & Khối vuông) dựa theo màn chơi
        obstacles = [];
        let genX = 600;
        while (genX < currentLevelConfig.length) {
            let type = Math.random() > 0.4 ? "spike" : "block";
            obstacles.push({ x: genX, y: 415, width: 35, height: 35, type: type });
            genX += Math.floor(Math.random() * 250) + 180;
        }
    }

    function pauseGame() {
        isPaused = true;
        document.getElementById("pause-screen").classList.remove("hidden");
        if (backgroundMusic) backgroundMusic.pause();
    }

    function resumeGame() {
        isPaused = false;
        document.getElementById("pause-screen").classList.add("hidden");
        if (backgroundMusic && backgroundMusic.src) backgroundMusic.play();
        requestAnimationFrame(gameLoop);
    }

    function restartLevel() {
        attemptCount++;
        resetPlayerAndLevel();
        if (backgroundMusic && backgroundMusic.src) {
            backgroundMusic.currentTime = 0;
            backgroundMusic.play();
        }
        requestAnimationFrame(gameLoop);
    }

    function exitToMenu() {
        isPaused = true;
        if (backgroundMusic) backgroundMusic.pause();
        backToMenu();
    }

    function togglePracticeMode() {
        practiceMode = !practiceMode;
        const btn = document.getElementById("practice-btn");
        btn.style.borderColor = practiceMode ? "#55ff00" : "white";
    }

    // Điều khiển nhảy
    window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
            if (currentScreen === "game-screen" && !isPaused) {
                if (player.grounded) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                }
            }
        }
    });

    canvas.addEventListener("mousedown", () => {
        if (currentScreen === "game-screen" && !isPaused) {
            if (player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }
        }
    });

    // Vòng lặp trò chơi chính (Game Loop)
    function gameLoop() {
        if (currentScreen !== "game-screen" || isPaused) return;

        // Cập nhật vật lý người chơi
        player.vy += player.gravity;
        player.y += player.vy;

        // Va chạm mặt đất
        if (player.y >= 415) {
            player.y = 415;
            player.vy = 0;
            player.grounded = true;
            // Xoay khớp về bội số của 90 độ khi chạm đất
            player.rotation = Math.round(player.rotation / 90) * 90;
        } else {
            player.grounded = false;
            player.rotation += 8; // Xoay khi đang nhảy
        }

        // Tiến độ màn chơi
        gameProgress += 4.5;
        let progressPercent = Math.min(100, Math.floor((gameProgress / currentLevelConfig.length) * 100));
        document.getElementById("progress-bar").style.width = progressPercent + "%";

        // Kiểm tra hoàn thành màn
        if (gameProgress >= currentLevelConfig.length) {
            alert("CHÚC MỪNG! BẠN ĐÃ CHIẾN THẮNG MÀN " + selectedLevel);
            backToMenu();
            return;
        }

        // Xóa màn hình canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Vẽ nền lưới phong cách Geometry Dash
        ctx.strokeStyle = "rgba(0, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Vẽ sàn nhà
        ctx.fillStyle = "#001133";
        ctx.fillRect(0, 450, canvas.width, 50);
        ctx.fillStyle = "#00ffff";
        ctx.fillRect(0, 450, canvas.width, 5);

        // Cập nhật và vẽ chướng ngại vật
        ctx.fillStyle = "#ff3333";
        obstacles.forEach(obs => {
            let screenX = obs.x - gameProgress;
            if (obs.type === "spike") {
                ctx.beginPath();
                ctx.moveTo(screenX, 450);
                ctx.lineTo(screenX + obs.width / 2, 450 - obs.height);
                ctx.lineTo(screenX + obs.width, 450);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                ctx.fillStyle = "#ff6600";
                ctx.fillRect(screenX, 450 - obs.height, obs.width, obs.height);
                ctx.strokeStyle = "#ffffff";
                ctx.strokeRect(screenX, 450 - obs.height, obs.width, obs.height);
            }

            // Kiểm tra va chạm (AABB Collision)
            let pBox = { x: player.x, y: player.y - player.size, w: player.size, h: player.size };
            let oBox = { x: screenX, y: 450 - obs.height, w: obs.width, h: obs.height };

            if (pBox.x < oBox.x + oBox.w && pBox.x + pBox.w > oBox.x &&
                pBox.y < oBox.y + oBox.h && pBox.y + pBox.h > oBox.y) {
                // Va chạm -> Chết & chơi lại
                createExplosion(player.x + player.size/2, player.y - player.size/2);
                setTimeout(() => { restartLevel(); }, 300);
                return;
            }
        });

        // Vẽ nhân vật hộp vuông (Player)
        ctx.save();
        ctx.translate(player.x + player.size/2, player.y - player.size/2);
        ctx.rotate((player.rotation * Math.PI) / 180);
        ctx.fillStyle = playerColor;
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
        // Mắt nhân vật
        ctx.fillStyle = "#000000";
        ctx.fillRect(2, -8, 8, 8);
        ctx.restore();

        requestAnimationFrame(gameLoop);
    }

    function createExplosion(x, y) {
        ctx.fillStyle = playerColor;
        for (let i = 0; i < 15; i++) {
            let px = x + (Math.random() - 0.5) * 50;
            let py = y + (Math.random() - 0.5) * 50;
            ctx.fillRect(px, py, 6, 6);
        }
    }
</script>

</body>
</html>
