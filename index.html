<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Deluxe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #05050d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(0, 240, 255, 0.3);
            cursor: pointer;
        }
        canvas {
            display: block;
            background: #000;
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-weight: 800;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        #progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            z-index: 10;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #00ff66, #ffe600);
            box-shadow: 0 0 12px #00f0ff;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 20;
        }
        #start-overlay h1 {
            font-size: 40px;
            color: #ffe600;
            text-shadow: 0 0 20px #ffe600;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .play-btn {
            background: #ffe600;
            color: #000;
            font-size: 22px;
            font-weight: 800;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px #ffe600;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .play-btn:hover {
            transform: scale(1.08);
        }
        .hint-text {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body><div id="game-container">
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div class="ui-overlay">
        <div id="mode-text">MODE: CUBE</div>
        <div id="percent-text">0%</div>
    </div>
    
    <div id="start-overlay">
        <h1>GEOMETRY DASH</h1>
        <button class="play-btn" id="start-btn">BẮT ĐẦU CHƠI</button>
        <p class="hint-text">(Hoặc bấm phím Space / Click màn hình để chơi)</p>
    </div>

    <canvas id="gameCanvas" width="900" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const progressBar = document.getElementById('progress-bar');
const percentText = document.getElementById('percent-text');
const modeText = document.getElementById('mode-text');
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const gameContainer = document.getElementById('game-container');

const CANVAS_WIDTH = canvas.width;
const CANVAS_HEIGHT = canvas.height;
const FLOOR_Y = 370;
const PLAYER_SIZE = 30;

let gameStarted = false;
let isInputActive = false;

// --- HỆ THỐNG ÂM THANH SFX ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'pad') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'explode') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'portal') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        }
    } catch(e){}
}

function startGame() {
    if (!gameStarted) {
        initAudio();
        gameStarted = true;
        startOverlay.style.display = 'none';
    }
}

// Bắt sự kiện bắt đầu chơi đa dạng
startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
startOverlay.addEventListener('click', startGame);

window.addEventListener('keydown', (e) => {
    if (!gameStarted) {
        if (e.code === 'Space' || e.code === 'Enter') startGame();
    } else {
        if (e.code === 'Space' || e.code === 'ArrowUp') isInputActive = true;
    }
});

window.addEventListener('keyup', (e) => {
    if (gameStarted && (e.code === 'Space' || e.code === 'ArrowUp')) isInputActive = false;
});

gameContainer.addEventListener('mousedown', () => { if (gameStarted) isInputActive = true; });
window.addEventListener('mouseup', () => { if (gameStarted) isInputActive = false; });

// --- CÁC HIỆU ỨNG HẠT ---
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.5) * 12;
        this.size = Math.random() * 6 + 2;
        this.color = color;
        this.alpha = 1;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.025;
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
    }
}

// --- PLAYER ---
class Player {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = 120;
        this.y = FLOOR_Y - PLAYER_SIZE;
        this.vy = 0;
        this.mode = 'CUBE';
        this.angle = 0;
        this.isGrounded = true;
        this.isDead = false;
        this.trail = [];
    }

    update() {
        if (this.isDead) return;

        if (Math.random() < 0.6) {
            this.trail.push({ x: this.x, y: this.y + PLAYER_SIZE/2, alpha: 0.6 });
        }
        this.trail.forEach(t => t.alpha -= 0.03);
        this.trail = this.trail.filter(t => t.alpha > 0);

        if (this.mode === 'CUBE') {
            const GRAVITY = 0.85;
            const JUMP_FORCE = -12.5;

            this.vy += GRAVITY;
            this.y += this.vy;

            if (this.isGrounded && isInputActive) {
                this.vy = JUMP_FORCE;
                this.isGrounded = false;
                playSound('jump');
            }

            if (this.y >= FLOOR_Y - PLAYER_SIZE) {
                this.y = FLOOR_Y - PLAYER_SIZE;
                this.vy = 0;
                this.isGrounded = true;this.angle = Math.round(this.angle / 90) * 90;
            } else {
                this.isGrounded = false;
                this.angle += 8.5;
            }
        } else if (this.mode === 'SHIP') {
            const SHIP_GRAVITY = 0.45;
            const LIFT = -0.7;

            if (isInputActive) {
                this.vy += LIFT;
            } else {
                this.vy += SHIP_GRAVITY;
            }

            this.vy = Math.max(-7, Math.min(7, this.vy));
            this.y += this.vy;
            this.angle = this.vy * 4;

            if (this.y >= FLOOR_Y - PLAYER_SIZE) {
                this.y = FLOOR_Y - PLAYER_SIZE;
                this.vy = 0;
            }
            if (this.y <= 0) {
                this.y = 0;
                this.vy = 0;
            }
        }
    }

    draw(ctx) {
        if (this.isDead) return;

        this.trail.forEach(t => {
            ctx.save();
            ctx.globalAlpha = t.alpha;
            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(t.x - 10, t.y - 3, 10, 6);
            ctx.restore();
        });

        ctx.save();
        ctx.translate(this.x + PLAYER_SIZE
