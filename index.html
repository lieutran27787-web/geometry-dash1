<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Ultra Smooth</title>
    <style>
        body {
            background-color: #0b0b14;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #menuScreen {
            position: absolute;
            width: 900px;
            height: 480px;
            background: linear-gradient(135deg, #0d0d26, #1a1a4a);
            border: 4px solid #333366;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.3);
            z-index: 20;
        }

        .menu-header {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .menu-title {
            font-size: 26px;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
        }

        .arrow-btn {
            background: #1a1a38;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            font-size: 20px;
            font-weight: bold;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0,255,204,0.3);
        }
        .arrow-btn:hover {
            background: #00ffcc;
            color: #0b0b14;
            transform: scale(1.1);
            box-shadow: 0 0 20px #00ffcc;
        }

        .menu-sections {
            display: flex;
            gap: 15px;
            width: 100%;
            height: 290px;
        }

        .level-grid {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 1px solid #222244;
        }

        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid #222244;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .level-card {
            background: #181830;
            border: 2px solid #444488;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .level-card:hover { border-color: #00ffcc; background: #222244; transform: scale(1.02); }
        .level-card.selected { border-color: #ffaa00; background: #2a2211; box-shadow: 0 0 12px #ffaa00; }
        .level-card h4 { margin: 0 0 3px 0; color: #fff; font-size: 14px; }
        .level-card p { margin: 0; color: #aaa; font-size: 11px; }
        .level-card .diff-badge {
            position: absolute; top: 5px; right: 5px; font-size: 10px; padding: 2px 5px; border-radius: 4px; font-weight: bold;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 6px;
            width: 100%;
        }

        .skin-btn {
            background: #1a1a38;
            border: 2px solid #555;
            border-radius: 6px;
            padding: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: 0.2s;
        }
        .skin-btn:hover { border-color: #fff; }
        .skin-btn.selected { border-color: #00ffcc; box-shadow: 0 0 10px #00ffcc; }

        .menu-footer {
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            justify-content: space-between;
        }

        .play-btn {
            background: linear-gradient(to bottom, #00ffcc, #00aa88);
            color: #0b0b14;
            border: none;
            padding: 10px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,255,204,0.6);
            transition: 0.2s;
        }
        .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #00ffcc; }

        .action-btn {
            background: #1a1a38; color: #00ffcc; border: 2px solid #00ffcc; padding: 8px 14px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        .action-btn:hover { background: #00ffcc; color: #0b0b14; }

        .game-container { position: relative; display: none; }
        canvas { border: 4px solid #1c1c38; background: #101020; box-shadow: 0 0 40px rgba(0, 255, 204, 0.3); border-radius: 12px; }

        #attemptsDisplay {
            position: absolute; top: 12px; left: 15px; font-size: 18px; font-weight: bold; color: #ffaa00;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.6); pointer-events: none; z-index: 10;
        }

        .top-bar { position: absolute; top: 10px; right: 15px; display: flex; gap: 10px; z-index: 10; }

        #settingsModal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #121224; border: 3px solid #ffaa00; padding: 25px 40px; border-radius: 12px;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.5); z-index: 100; text-align: center;
        }
        #settingsModal h3 { margin-top: 0; color: #ffaa00; }
        .setting-option { margin: 15px 0; font-size: 14px; display: flex; justify-content: space-between; gap: 30px; align-items: center; }
        .setting-option input { transform: scale(1.3); cursor: pointer; }
        .close-modal { background: #ff0055; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        #info { font-size: 15px; margin-top: 10px; font-weight: bold; color: #ff0055; text-shadow: 0 0 8px rgba(255,0,85,0.4); display: none; }
    </style>
</head>
<body>

    <!-- MENU CHỌN MÀN -->
    <div id="menuScreen">
        <div class="menu-header">
            <button class="arrow-btn" onclick="changeLevelBy(-1)">&#9664;</button>
            <h2 class="menu-title" id="menuTitleDisplay">MÀN 1: Stereo Madness</h2>
            <button class="arrow-btn" onclick="changeLevelBy(1)">&#9654;</button>
        </div>
        
        <div class="menu-sections">
            <div class="level-grid" id="levelGrid"></div>
            
            <div class="side-panel">
                <div class="panel-box" style="flex: 1;">
                    <span style="font-size: 12px; color: #ffaa00; font-weight: bold;">SKIN NHÂN VẬT</span>
                    <div class="skin-grid">
                        <button class="skin-btn selected" style="border-color: #00ffcc;" onclick="selectSkin('#00ffcc', this)">Cyan</button>
                        <button class="skin-btn" style="border-color: #ff5500;" onclick="selectSkin('#ff5500', this)">Orange</button>
                        <button class="skin-btn" style="border-color: #00ff55;" onclick="selectSkin('#00ff55', this)">Green</button>
                        <button class="skin-btn" style="border-color: #ff0055;" onclick="selectSkin('#ff0055', this)">Red</button>
                    </div>
                </div>

                <div class="panel-box" style="margin-top: 10px;">
                    <label for="musicUpload" class="action-btn" style="cursor: pointer; width: 100%; text-align: center; font-size: 12px;">📁 Chọn Nhạc MP3</label>
                    <input type="file" id="musicUpload" accept="audio/*" style="display:none;">
                    <span id="songName" style="font-size: 10px; color: #aaa; margin-top: 5px; text-align: center;">Mặc định nhạc theo màn</span>
                </div>
            </div>
        </div>

        <div class="menu-footer">
            <button class="action-btn" onclick="openSettings()">⚙️ Cài Đặt</button>
            <button class="play-btn" onclick="startSelectedLevel()">BẮT ĐẦU CHƠI</button>
            <div style="display: flex; gap: 6px; align-items: center;">
                <span style="font-size: 12px; color: #ffaa00;">Độ khó:</span>
                <select id="diffSelect" style="background:#1a1a38; color:white; border:1px solid #ffaa00; padding:5px; border-radius:5px;">
                    <option value="easy">Dễ</option>
                    <option value="medium" selected>Thường</option>
                    <option value="hard">Khó (Demon)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- KHUNG TRÒ CHƠI -->
    <div class="game-container" id="gameContainer">
        <div id="attemptsDisplay">Attempts: 1</div>
        <div class="top-bar">
            <button class="action-btn" onclick="openSettings()">⚙️ Cài Đặt</button>
            <button class="action-btn" onclick="returnToMenu()">🏠 Thoát</button>
        </div>
        <canvas id="gameCanvas" width="850" height="400"></canvas>

        <div id="settingsModal">
            <h3>⚙️ GAME SETTINGS</h3>
            <div class="setting-option"><span>Rung màn hình (Screen Shake):</span><input type="checkbox" id="settingShake" checked></div>
            <div class="setting-option"><span>Đổi màu nền động (Dynamic BG):</span><input type="checkbox" id="settingBgColor" checked></div>
            <div class="setting-option"><span>Âm thanh điện tử (Synth):</span><input type="checkbox" id="settingAudio" checked></div>
            <button class="close-modal" onclick="closeSettings()">Lưu & Đóng</button>
        </div>
    </div>

    <div id="info">Nhấn Space hoặc Click để nhảy / bay / dùng lò xo</div>
    <audio id="bgMusic" loop></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const infoEl = document.getElementById("info");
        const bgMusic = document.getElementById("bgMusic");
        const musicUpload = document.getElementById("musicUpload");
        const songNameEl = document.getElementById("songName");
        const attemptsDisplay = document.getElementById("attemptsDisplay");
        const menuScreen = document.getElementById("menuScreen");
        const gameContainer = document.getElementById("gameContainer");
        const settingsModal = document.getElementById("settingsModal");
        const diffSelect = document.getElementById("diffSelect");
        const menuTitleDisplay = document.getElementById("menuTitleDisplay");

        let settings = { shake: true, bgColor: true, audio: true };
        let customAudioActive = false;
        let attemptCount = 1;
        let selectedLevel = 1;
        let playerColor = "#00ffcc";

        function selectSkin(color, btn) {
            playerColor = color;
            document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        const levelDataList = [
            { name: "Stereo Madness", diff: "Easy", notes: [261, 329, 392, 523], speed: 220 },
            { name: "Back On Track", diff: "Easy", notes: [220, 277, 330, 440], speed: 200 },
            { name: "Polargeist", diff: "Normal", notes: [196, 247, 294, 392], speed: 190 },
            { name: "Dry Out", diff: "Normal", notes: [330, 392, 440, 523], speed: 170 },
            { name: "Base After Base", diff: "Hard", notes: [247, 311, 370, 493], speed: 180 },
            { name: "Can't Let Go", diff: "Hard", notes: [220, 261, 329, 440], speed: 160 },
            { name: "Jumper", diff: "Harder", notes: [293, 370, 440, 587], speed: 175 },
            { name: "Time Machine", diff: "Harder", notes: [174, 220, 261, 349], speed: 190 },
            { name: "Cycles", diff: "Insane", notes: [261, 311, 392, 523], speed: 150 },
            { name: "xStep", diff: "Insane", notes: [220, 293, 370, 440], speed: 140 },
            { name: "Clutterfunk", diff: "Insane", notes: [196, 233, 294, 392], speed: 135 },
            { name: "Theory of Everything", diff: "Demon", notes: [330, 415, 493, 659], speed: 130 },
            { name: "Electroman Adv", diff: "Insane", notes: [247, 330, 392, 523], speed: 150 },
            { name: "Clubstep", diff: "Demon", notes: [164, 207, 246, 329], speed: 120 },
            { name: "Deadlocked", diff: "Demon", notes: [150, 185, 220, 300], speed: 110 }
        ];

        const levelGrid = document.getElementById("levelGrid");
        levelDataList.forEach((lvl, idx) => {
            let i = idx + 1;
            let card = document.createElement("div");
            card.className = `level-card ${i === 1 ? 'selected' : ''}`;
            let badgeColor = lvl.diff === 'Easy' ? '#00ffcc' : (lvl.diff === 'Normal' ? '#00aa55' : (lvl.diff === 'Hard' ? '#ffaa00' : '#ff0055'));
            card.innerHTML = `
                <span class="diff-badge" style="background:${badgeColor}; color:#000;">${lvl.diff}</span>
                <h4>Màn ${i}</h4>
                <p>${lvl.name}</p>
            `;
            card.onclick = () => { selectLevel(i); };
            levelGrid.appendChild(card);
        });

        function selectLevel(id) {
            selectedLevel = id;
            document.querySelectorAll('.level-card').forEach((c, idx) => {
                if (idx + 1 === id) c.classList.add('selected');
                else c.classList.remove('selected');
            });
            menuTitleDisplay.innerText = `MÀN ${id}: ${levelDataList[id-1].name}`;
        }

        function changeLevelBy(direction) {
            let newLevel = selectedLevel + direction;
            if (newLevel >= 1 && newLevel <= 15) selectLevel(newLevel);
        }

        musicUpload.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                bgMusic.src = URL.createObjectURL(file);
                songNameEl.innerText = "🎵 " + file.name;
                customAudioActive = true;
            }
        });

        function openSettings() { settingsModal.style.display = "block"; }
        function closeSettings() {
            settings.shake = document.getElementById("settingShake").checked;
            settings.bgColor = document.getElementById("settingBgColor").checked;
            settings.audio = document.getElementById("settingAudio").checked;
            settingsModal.style.display = "none";
        }

        function returnToMenu() {
            isPlaying = false; stopSynthMusic();
            gameContainer.style.display = "none"; menuScreen.style.display = "flex"; infoEl.style.display = "none";
        }

        function startSelectedLevel() {
            menuScreen.style.display = "none"; gameContainer.style.display = "block"; infoEl.style.display = "block";
            attemptCount = 1; attemptsDisplay.innerText = "Attempts: " + attemptCount;
            startGame();
            gameLoop();
        }

        let audioCtx = null, synthTimer = null;
        function startSynthMusic(levelId) {
            if (!settings.audio) return;
            if (customAudioActive) { bgMusic.play().catch(()=>{}); return; }
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopSynthMusic();
            let songData = levelDataList[levelId - 1];
            let step = 0;
            synthTimer = setInterval(() => {
                if (!isPlaying || !settings.audio) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = levelId > 10 ? 'sawtooth' : 'triangle';
                    osc.frequency.setValueAtTime(songData.notes[step % songData.notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                    step++;
                } catch(e){}
            }, songData.speed);
        }
        function stopSynthMusic() {
            if (synthTimer) { clearInterval(synthTimer); synthTimer = null; }
            if (!customAudioActive) bgMusic.pause();
        }

        let gameMode = "cube";
        let isPlaying = false, isGameOver = false, isWon = false;
        let gameSpeed = 7.5, frameCount = 0;
        let particles = [], shipTrails = [], screenShake = 0, flashAlpha = 0, bgHue = 200;
        let goalPortal = null;

        let player = {
            x: 150, y: 300, size: 32, vy: 0, gravity: 0.75, jumpPower: -12, rotation: 0, isGrounded: false,
            scaleX: 1, scaleY: 1
        };

        let objects = [], levelLength = 10000;

        function loadLevelData() {
            objects = [];
            let diff = diffSelect.value;
            let baseSpeed = diff === 'easy' ? 6.8 : (diff === 'medium' ? 7.8 : 9.0);
            gameSpeed = baseSpeed + (selectedLevel - 1) * 0.1;
            levelLength = 9000 + selectedLevel * 800;

            let cursor = 600;
            while (cursor < levelLength - 700) {
                if (cursor % 3200 === 1600) {
                    objects.push({ type: "portal_ship", x: cursor, y: 250, w: 30, h: 80, activated: false });
                    cursor += 350;
                } else if (cursor % 6400 === 4800) {
                    objects.push({ type: "portal_cube", x: cursor, y: 250, w: 30, h: 80, activated: false });
                    cursor += 350;
                }

                let r = cursor % 4;
                if (r === 0) {
                    // Khối gạch lơ lửng để chạy trên đó
                    objects.push({ type: "platform", x: cursor, y: 275, w: 120, h: 90 });
                    objects.push({ type: "spike", x: cursor + 45, y: 240, w: 25, h: 35 });
                } else if (r === 1) {
                    objects.push({ type: "pad", x: cursor, y: 345, w: 40, h: 20 });
                    objects.push({ type: "spike", x: cursor + 80, y: 330, w: 25, h: 35 });
                } else {
                    objects.push({ type: "spike", x: cursor, y: 330, w: 25, h: 35 });
                }
                cursor += 420;
            }
            goalPortal = { x: levelLength, y: 200, w: 40, h: 120, sucked: false, suckProgress: 0 };
            objects.push({ type: "goal", x: levelLength, y: 0, w: 20, h: 400 });
        }

        let isHolding = false;
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                if (settingsModal.style.display === "block" || menuScreen.style.display === "flex") return;
                isHolding = true;
                if (!isPlaying && (isGameOver || isWon)) { startGame(); gameLoop(); }
                else if (gameMode === "cube" && player.isGrounded) {
                    player.vy = player.jumpPower; player.isGrounded = false;
                    player.scaleX = 0.7; player.scaleY = 1.3;
                }
                e.preventDefault();
            }
        });
        window.addEventListener("keyup", (e) => { if (e.code === "Space" || e.code === "ArrowUp") isHolding = false; });

        canvas.addEventListener("mousedown", () => {
            if (settingsModal.style.display === "block") return;
            isHolding = true;
            if (!isPlaying && (isGameOver || isWon)) { startGame(); gameLoop(); }
            else if (gameMode === "cube" && player.isGrounded) {
                player.vy = player.jumpPower; player.isGrounded = false;
                player.scaleX = 0.7; player.scaleY = 1.3;
            }
        });
        canvas.addEventListener("mouseup", () => { isHolding = false; });

        function startGame() {
            isPlaying = true; isGameOver = false; isWon = false;
            frameCount = 0; gameMode = "cube";
            player.y = 300; player.vy = 0; player.rotation = 0;
            player.scaleX = 1; player.scaleY = 1;
            particles = []; shipTrails = [];
            loadLevelData();
            startSynthMusic(selectedLevel);
        }

        function triggerExplosion(x, y) {
            if (settings.shake) screenShake = 20;
            flashAlpha = 0.8;
            attemptCount++;
            attemptsDisplay.innerText = "Attempts: " + attemptCount;
            stopSynthMusic();
            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 7 + 2,
                    color: Math.random() > 0.4 ? playerColor : "#ff0055",
                    life: 45
                });
            }
        }

        function update() {
            if (!isPlaying) return;

            if (isWon) {
                if (goalPortal) {
                    goalPortal.suckProgress += 0.04;
                    player.x += (goalPortal.x + goalPortal.w/2 - player.x) * 0.1;
                    player.y += (goalPortal.y + goalPortal.h/2 - player.y) * 0.1;
                    player.size *= 0.93;
                    player.rotation += 25;
                    if (goalPortal.suckProgress > 1.5) isPlaying = false;
                }
                return;
            }

            if (isGameOver) return;

            frameCount++;
            if (settings.bgColor) bgHue = (bgHue + 0.3) % 360;
            if (screenShake > 0) screenShake--;
            if (flashAlpha > 0) flashAlpha -= 0.05;

            player.scaleX += (1 - player.scaleX) * 0.2;
            player.scaleY += (1 - player.scaleY) * 0.2;

            let dist = frameCount * gameSpeed;
            let pct = Math.min(100, Math.floor((dist / levelLength) * 100));
            infoEl.innerText = `Màn ${selectedLevel} (${levelDataList[selectedLevel-1].name}) | ${pct}% | ${gameMode.toUpperCase()}`;

            if (gameMode === "cube") {
                player.vy += player.gravity; 
                player.y += player.vy;
                
                let landed = false;
                // Kiểm tra tiếp đất trên sàn chính
                if (player.y >= 333) {
                    player.y = 333; 
                    landed = true;
                } else {
                    // Kiểm tra chạy và tiếp đất trên bề mặt các khối (Platform)
                    for (let obj of objects) {
                        if (obj.type === "platform") {
                            // Chỉ bắt va chạm khi nhân vật rơi xuống từ phía trên (vy > 0) và nằm trong khoảng chiều rộng bệ
                            if (player.vy >= 0 &&
                                player.x + player.size - 6 > obj.x && 
                                player.x + 6 < obj.x + obj.w &&
                                player.y + player.size >= obj.y && 
                                player.y + player.size - player.vy <= obj.y + 12) {
                                player.y = obj.y - player.size;
                                landed = true;
                                break;
                            }
                        }
                    }
                }

                if (landed) {
                    if (!player.isGrounded) { player.scaleX = 1.3; player.scaleY = 0.7; }
                    player.vy = 0; 
                    player.isGrounded = true;
                    player.rotation = Math.round(player.rotation / 90) * 90;
                } else {
                    player.isGrounded = false; 
                    player.rotation += 10;
                }
            } else if (gameMode === "ship") {
                if (isHolding) player.vy -= 0.65; else player.vy += 0.65;
                if (player.vy > 8.5) player.vy = 8.5; if (player.vy < -8.5) player.vy = -8.5;
                player.y += player.vy; player.rotation = player.vy * 2.5;
                if (player.y < 0) { player.y = 0; player.vy = 0; }
                if (player.y > 333) { player.y = 333; player.vy = 0; }
                shipTrails.push({ x: player.x, y: player.y + player.size/2, alpha: 1.0 });
            }

            for (let i = shipTrails.length - 1; i >= 0; i--) {
                shipTrails[i].x -= gameSpeed; shipTrails[i].alpha -= 0.06;
                if (shipTrails[i].alpha <= 0) shipTrails.splice(i, 1);
            }

            for (let i = 0; i < objects.length; i++) {
                let obj = objects[i];
                obj.x -= gameSpeed;

                // Va chạm Gai nhọn
                if (obj.type === "spike") {
                    if (
                        player.x < obj.x + obj.w - 6 && player.x + player.size > obj.x + 6 &&
                        player.y < obj.y + obj.h - 6 && player.y + player.size > obj.y + 6
                    ) {
                        isGameOver = true; stopSynthMusic();
                        triggerExplosion(player.x + player.size/2, player.y + player.size/2);
                    }
                }

                // Va chạm đệm lò xo
                if (obj.type === "pad") {
                    if (
                        player.x < obj.x + obj.w && player.x + player.size > obj.x &&
                        player.y + player.size >= obj.y && player.y <= obj.y + obj.h
                    ) {
                        player.vy = player.jumpPower * 1.35;
                        player.isGrounded = false;
                        player.scaleX = 0.6; player.scaleY = 1.4;
                    }
                }

                if (obj.type === "portal_ship" && !obj.activated && player.x < obj.x + obj.w && player.x + player.size > obj.x && player.y < obj.y + obj.h && player.y + player.size > obj.y) {
                    gameMode = "ship"; obj.activated = true; flashAlpha = 0.4; if (settings.shake) screenShake = 10;
                }
                if (obj.type === "portal_cube" && !obj.activated && player.x < obj.x + obj.w && player.x + player.size > obj.x && player.y < obj.y + obj.h && player.y + player.size > obj.y) {
                    gameMode = "cube"; obj.activated = true; flashAlpha = 0.4; if (settings.shake) screenShake = 10;
                }

                if (obj.type === "goal" && player.x > obj.x && !isWon) {
                    isWon = true; stopSynthMusic();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            if (screenShake > 0 && settings.shake) {
                ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
            }

            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, `hsl(${bgHue}, 65%, 16%)`);
            grad.addColorStop(1, `hsl(${bgHue + 45}, 55%, 8%)`);
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#030308"; ctx.fillRect(0, 365, canvas.width, 35);
            ctx.fillStyle = playerColor; ctx.shadowColor = playerColor; ctx.shadowBlur = 12;
            ctx.fillRect(0, 365, canvas.width, 4); ctx.shadowBlur = 0;

            shipTrails.forEach(t => {
                ctx.fillStyle = `rgba(0, 255, 255, ${t.alpha})`;
                ctx.fillRect(t.x, t.y - 2, 6, 6);
            });

            if (goalPortal) {
                ctx.save();
                ctx.translate(goalPortal.x + goalPortal.w/2, goalPortal.y + goalPortal.h/2);
                ctx.rotate(frameCount * 0.08);
                ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 4;
                ctx.shadowColor = "#00ffcc"; ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.ellipse(0, 0, goalPortal.w, goalPortal.h/2, 0, 0, Math.PI * 2);
                ctx.stroke(); ctx.restore();
            }

            objects.forEach(obj => {
                if (obj.type === "spike") {
                    ctx.fillStyle = "#ff0055"; ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 8;
                    ctx.beginPath(); ctx.moveTo(obj.x, obj.y + obj.h);
                    ctx.lineTo(obj.x + obj.w / 2, obj.y); ctx.lineTo(obj.x + obj.w, obj.y + obj.h);
                    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
                } else if (obj.type === "platform") {
                    ctx.fillStyle = "#1e1e38"; ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = playerColor; ctx.lineWidth = 2; ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                } else if (obj.type === "pad") {
                    ctx.fillStyle = "#ff00aa"; ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                } else if (obj.type.startsWith("portal") && !obj.activated) {
                    ctx.fillStyle = obj.type === "portal_ship" ? "rgba(0, 150, 255, 0.5)" : "rgba(255, 150, 0, 0.5)";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                }
            });

            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(index, 1);
            });

            if (!isGameOver && player.size > 1) {
                ctx.save();
                ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                ctx.rotate((player.rotation * Math.PI) / 180);
                ctx.scale(player.scaleX, player.scaleY);

                if (gameMode === "cube") {
                    ctx.fillStyle = playerColor; ctx.shadowColor = playerColor; ctx.shadowBlur = 12;
                    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                    ctx.shadowBlur = 0; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
                    ctx.strokeRect(-player.size / 2 + 3, -player.size / 2 + 3, player.size - 6, player.size - 6);

                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(-6, -6, 5, 8); 
                    ctx.fillRect(2, -6, 5, 8);
                    ctx.fillStyle = "#030308";
                    ctx.fillRect(-4, -4, 2, 4);  
                    ctx.fillRect(4, -4, 2, 4);   
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(-4, 4, 9, 3);
                } else if (gameMode === "ship") {
                    ctx.fillStyle = playerColor; ctx.shadowColor = playerColor; ctx.shadowBlur = 12;
                    ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-16, -13); ctx.lineTo(-6, 0); ctx.lineTo(-16, 13);
                    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = "#fff"; ctx.stroke();
                }
                ctx.restore();
            }

            if (flashAlpha > 0) { ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`; ctx.fillRect(0,0,canvas.width,canvas.height); }
            ctx.restore();

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055"; ctx.font = "bold 40px 'Segoe UI'"; ctx.textAlign = "center";
                ctx.fillText("CRASH!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "white"; ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Nhấn Space để Thử lại", canvas.width / 2, canvas.height / 2 + 25);
            }
            if (isWon && goalPortal.suckProgress > 1.5) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc"; ctx.font = "bold 38px 'Segoe UI'"; ctx.textAlign = "center";
                ctx.fillText(`LEVEL COMPLETE!`, canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "white"; ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Nhấn Space để về Menu", canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function gameLoop() {
            if (isPlaying || (isWon && goalPortal.suckProgress <= 1.5)) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            } else if (isWon) {
                draw();
            }
        }
    </script>
</body>
</html>
