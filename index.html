<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Neon Web Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0c0c14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            font-size: 24px;
            letter-spacing: 2px;
        }
        .game-wrapper {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.25);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #1f1f3a;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #111122, #1b1b3a);
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(12, 12, 20, 0.85);
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        .title-screen {
            font-size: 38px;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc;
            margin-bottom: 15px;
            text-align: center;
        }
        .instruction {
            font-size: 18px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: pulse 1.5s infinite;
        }
        .game-over-screen {
            font-size: 42px;
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 25px #ff0055;
            margin-bottom: 10px;
        }
        .score-display {
            font-size: 22px;
            color: #ffaa00;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }
        .btn-retry {
            background: linear-gradient(to bottom, #00ffcc, #00aa88);
            color: #0c0c14;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-retry:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #00ffcc;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .hud-score {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>GEOMETRY DASH NEON</h1>
    <div class="game-wrapper">
        <div class="hud-score" id="hudScore">Điểm: 0</div>
        
        <!-- Màn hình Bắt đầu -->
        <div class="ui-overlay" id="startScreen">
            <div class="title-screen">GEOMETRY DASH</div>
            <div class="instruction">Nhấn Space hoặc Click để Bắt đầu</div>
        </div>

        <!-- Màn hình Thua cuộc -->
        <div class="ui-overlay hidden" id="gameOverScreen">
            <div class="game-over-screen">CRASH!</div>
            <div class="score-display" id="finalScore">Điểm đạt được: 0</div>
            <button class="btn-retry" id="retryBtn">CHƠI LẠI</button>
        </div>

        <canvas id="gameCanvas" width="850" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startScreen = document.getElementById("startScreen");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const hudScore = document.getElementById("hudScore");
        const finalScore = document.getElementById("finalScore");
        const retryBtn = document.getElementById("retryBtn");

        // Trạng thái trò chơi
        let gameState = "START"; // START, PLAYING, GAMEOVER
        let score = 0;
        let gameSpeed = 7;
        let frameCount = 0;

        // Cấu hình nhân vật (Cube)
        let player = {
            x: 150,
            y: 300,
            size: 32,
            vy: 0,
            gravity: 0.85,
            jumpPower: -13,
            rotation: 0,
            isGrounded: false
        };

        let obstacles = [];
        let particles = [];

        // Khởi tạo màn chơi mẫu sinh vật cản tự động liên tục
        function generateMapObstacles() {
            obstacles = [];
            let currentX = 600;
            for (let i = 0; i < 50; i++) {
                let type = Math.random();
                if (type < 0.6) {
                    // Gai đơn
                    obstacles.push({ type: "spike", x: currentX, y: 333, w: 28, h: 35 });
                    currentX += 350 + Math.random() * 200;
                } else if (type < 0.8) {
                    // Gai đôi
                    obstacles.push({ type: "spike", x: currentX, y: 333, w: 28, h: 35 });
                    obstacles.push({ type: "spike", x: currentX + 28, y: 333, w: 28, h: 35 });
                    currentX += 450 + Math.random() * 200;
                } else {
                    // Bệ đỡ lơ lửng có gai phía trên hoặc dưới
                    obstacles.push({ type: "block", x: currentX, y: 260, w: 80, h: 25 });
                    obstacles.push({ type: "spike", x: currentX + 25, y: 225, w: 25, h: 35 });
                    currentX += 400 + Math.random() * 200;
                }
            }
        }

        function resetGame() {
            player.y = 300;
            player.vy = 0;
            player.rotation = 0;
            player.isGrounded = false;
            score = 0;
            gameSpeed = 7;
            frameCount = 0;
            generateMapObstacles();
            particles = [];
        }

        // Tạo hiệu ứng hạt nổ neon khi chết
        function createExplosion(x, y) {
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14,
                    size: Math.random() * 6 + 2,
                    color: Math.random() > 0.5 ? "#00ffcc" : "#ff0055",
                    life: 40
                });
            }
        }

        // Xử lý thao tác nhảy
        function triggerJump() {
            if (gameState === "START") {
                gameState = "PLAYING";
                startScreen.classList.add("hidden");
                resetGame();
            } else if (gameState === "PLAYING" && player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
            } else if (gameState === "GAMEOVER") {
                gameState = "PLAYING";
                gameOverScreen.classList.add("hidden");
                resetGame();
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                triggerJump();
                e.preventDefault();
            }
        });

        canvas.addEventListener("click", () => {
            triggerJump();
        });

        retryBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            gameState = "PLAYING";
            gameOverScreen.classList.add("hidden");
            resetGame();
        });

        // Vòng lặp cập nhật trạng thái game (Update)
        function update() {
            if (gameState !== "PLAYING") return;

            frameCount++;
            score = Math.floor(frameCount / 6);
            hudScore.innerText = "Điểm: " + score;

            // Tăng độ khó tốc độ dần theo thời gian
            if (frameCount % 500 === 0) {
                gameSpeed += 0.5;
            }

            // Vật lý trọng lực nhân vật
            player.vy += player.gravity;
            player.y += player.vy;

            // Xử lý chạm sàn mặt đất
            if (player.y >= 333) {
                player.y = 333;
                player.vy = 0;
                player.isGrounded = true;
                // Căn chỉnh mượt góc xoay về bội số gần nhất của 90 độ
                player.rotation = Math.round(player.rotation / 90) * 90;
            } else {
                player.isGrounded = false;
                player.rotation += 9; // Xoay vòng khi ở trên không
            }

            // Di chuyển và kiểm tra chướng ngại vật
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Kiểm tra va chạm chính xác AABB Collision
                // Thu nhỏ vùng va chạm (hitbox padding) một chút để trải nghiệm công bằng và mượt mà hơn
                let pBox = { x: player.x + 4, y: player.y + 4, w: player.size - 8, h: player.size - 8 };
                let oBox = { x: obs.x + 3, y: obs.y + 3, w: obs.w - 6, h: obs.h - 6 };

                if (
                    pBox.x < oBox.x + oBox.w &&
                    pBox.x + pBox.w > oBox.x &&
                    pBox.y < oBox.y + oBox.h &&
                    pBox.y + pBox.h > oBox.y
                ) {
                    gameState = "GAMEOVER";
                    finalScore.innerText = "Điểm đạt được: " + score;
                    gameOverScreen.classList.remove("hidden");
                    createExplosion(player.x + player.size / 2, player.y + player.size / 2);
                }

                // Xóa vật cản khi đã chạy ra khỏi khung hình bên trái
                if (obs.x + obs.w < 0) {
                    obstacles.splice(i, 1);
                    // Tự động sinh thêm vật cản phía trước để kéo dài map chơi vô tận
                    let lastObsX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : canvas.width;
                    let r = Math.random();
                    if (r < 0.5) {
                        obstacles.push({ type: "spike", x: lastObsX + 350 + Math.random() * 150, y: 333, w: 28, h: 35 });
                    } else {
                        obstacles.push({ type: "block", x: lastObsX + 380, y: 260, w: 80, h: 25 });
                        obstacles.push({ type: "spike", x: lastObsX + 405, y: 225, w: 25, h: 35 });
                    }
                }
            }
        }

        // Vòng lặp vẽ đồ họa (Render Canvas)
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ nền lưới trang trí phong cách cyberpunk nhẹ
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            // Vẽ sàn mặt đất phát sáng neon
            ctx.fillStyle = "#070710";
            ctx.fillRect(0, 365, canvas.width, 35);
            ctx.fillStyle = "#00ffcc";
            ctx.shadowColor = "#00ffcc";
            ctx.shadowBlur = 15;
            ctx.fillRect(0, 365, canvas.width, 4);
            ctx.shadowBlur = 0; // Reset shadow

            // Vẽ chướng ngại vật (Gai & Block)
            obstacles.forEach(obs => {
                if (obs.type === "spike") {
                    ctx.fillStyle = "#ff0055";
                    ctx.shadowColor = "#ff0055";
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.h);
                    ctx.lineTo(obs.x + obs.w / 2, obs.y);
                    ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (obs.type === "block") {
                    ctx.fillStyle = "#222244";
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeStyle = "#00ffcc";
                    ctx.shadowColor = "#00ffcc";
                    ctx.shadowBlur = 8;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.shadowBlur = 0;
                }
            });

            // Vẽ hiệu ứng hạt khi nổ
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(index, 1);
            });

            // Vẽ nhân vật (Cube) nếu chưa thua
            if (gameState !== "GAMEOVER" || particles.length > 0) {
                ctx.save();
                ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                ctx.rotate((player.rotation * Math.PI) / 180);

                // Khối vuông phát sáng neon
                ctx.fillStyle = "#00ffcc";
                ctx.shadowColor = "#00ffcc";
                ctx.shadowBlur = 15;
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.shadowBlur = 0;

                // Viền trang trí bên trong khối vuông
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.strokeRect(-player.size / 2 + 5, -player.size / 2 + 5, player.size - 10, player.size - 10);

                ctx.restore();
            }
        }

        // Vòng lặp chính của trò chơi (Game Loop 60 FPS)
        function mainLoop() {
            update();
            draw();
            requestAnimationFrame(mainLoop);
        }

        // Kích hoạt chạy game ngay khi tải xong
        generateMapObstacles();
        mainLoop();
    </script>
</body>
</html>
