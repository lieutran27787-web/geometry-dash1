<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Deluxe - Custom Music Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #05050d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(0, 240, 255, 0.3);
        }
        canvas {
            display: block;
            background: #000;
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-weight: 800;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        #progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            z-index: 10;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #00ff66, #ffe600);
            box-shadow: 0 0 12px #00f0ff;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 20;
        }
        #start-overlay h1 {
            font-size: 40px;
            color: #ffe600;
            text-shadow: 0 0 20px #ffe600;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        
        /* Bảng chọn nhạc MP3 */
        .audio-uploader {
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed #00f0ff;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .audio-uploader:hover {
            background: rgba(0, 240, 255, 0.15);
        }
        .custom-file-btn {
            display: inline-block;
            background: #00f0ff;
            color: #000;
            padding: 8px 18px;
            font-weight: bold;
