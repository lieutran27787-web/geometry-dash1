<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Pro Edition</title>
    <style>
        body {
            background-color: #0c0c14;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h2 {
            margin-bottom: 5px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        canvas {
            border: 4px solid #1f1f3a;
            background: linear-gradient(to bottom, #111122, #1b1b3a);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            border-radius: 10px;
        }
        #info {
            font-size: 18px;
            margin-top: 10px;
            font-weight: bold;
            color: #ffaa00;
        }
    </style>
</head>
<body>

    <h2>GEOMETRY DASH PRO</h2>
    <canvas id="gameCanvas" width="850" height="400"></canvas>
    <div id="info">Tiến độ: 0% | Chế độ: Khối Vuông</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const infoEl = document.getElementById("info");

        // Trạng thái game
        let gameMode = "cube"; // "cube" hoặc "ship"
        let isPlaying = false;
        let isGameOver = false;
        let isWon = false;
        let score = 0;
        let gameSpeed = 7;
        let frameCount = 0;
        let particles = [];

        // Người chơi
        let player = {
            x: 150,
            y: 300,
            size: 30,
            vy: 0,
            gravity: 0.8,
            jumpPower: -13,
            rotation: 0,
            isGrounded: false
        };

        // Danh sách vật phẩm & chướng ngại vật trong level mẫu
        let objects = [];

        function initLevel() {
            objects = [
                { type: "spike", x: 600, y: 330, w: 25, h: 35 },
                { type: "spike", x: 900, y: 330, w: 25, h: 35 },
                { type: "spike", x: 930, y: 330, w: 25, h: 35 },
                // Cổng đổi sang phi thuyền
                { type: "portal_ship", x: 1300, y: 250, w: 30, h: 80, activated: false },
                // Chướng ngại vật trên không cho phi thuyền
                { type: "block", x: 1600, y: 0, w: 50, h: 120 },
                { type: "block", x: 1600, y: 280, w: 50, h: 120 },
                { type: "spike", x: 2000, y: 330, w: 25, h: 35 },
                // Cổng đổi về khối vuông
                { type: "portal_cube", x: 2300, y: 250, w: 30, h: 80, activated: false },
                { type: "spike", x: 2700, y: 330, w: 25, h: 35 },
                { type: "spike", x: 2730, y: 330, w: 25, h: 35 },
                // Về đích
                { type: "goal", x: 3200, y: 0, w: 20, h: 400 }
            ];
        }

        let isHolding = false;

        // Xử lý phím bấm & chuột
        window.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                isHolding = true;
                if (!isPlaying) {
                    startGame();
                } else if (gameMode === "cube" && player.isGrounded) {
                    player.vy = player.jumpPower;
                    player.isGrounded = false;
                }
                e.preventDefault();
            }
        });

        window.addEventListener("keyup", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                isHolding = false;
            }
        });

        canvas.addEventListener("mousedown", () => {
            isHolding = true;
            if (!isPlaying) startGame();
            else if (gameMode === "cube" && player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
            }
        });

        canvas.addEventListener("mouseup", () => { isHolding = false; });

        function startGame() {
            isPlaying = true;
            isGameOver = false;
            isWon = false;
            score = 0;
            gameSpeed = 7;
            frameCount = 0;
            gameMode = "cube";
            player.y = 300;
            player.vy = 0;
            player.rotation = 0;
            particles = [];
            initLevel();
            loop();
        }

        // Tạo hiệu ứng nổ hạt khi chết
        function createExplosion(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    size: Math.random() * 6 + 2,
                    color: Math.random() > 0.5 ? "#00ffcc" : "#ff0055",
                    life: 40
                });
            }
        }

        function update() {
            if (!isPlaying || isGameOver || isWon) return;

            frameCount++;
            let progress = Math.min(100, Math.floor((objects[objects.length - 1].x - (3200 - objects[objects.length - 1].x)) / 32)); 
            // Tính phần trăm đơn giản dựa vào khoảng cách camera
            let totalDist = 3200;
            let currentDist = frameCount * gameSpeed;
            let percent = Math.min(100, Math.floor((currentDist / totalDist) * 100));
            
            infoEl.innerText = `Tiến độ: ${percent}% | Chế độ: ${gameMode === "cube" ? "Khối Vuông" : "Phi Thuyền"}`;

            // Vật lý nhân vật
            if (gameMode === "cube") {
                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= 330) {
                    player.y = 330;
                    player.vy = 0;
                    player.isGrounded = true;
                    player.rotation = Math.round(player.rotation / 90) * 90;
                } else {
                    player.isGrounded = false;
                    player.rotation += 8;
                }
            } else if (gameMode === "ship") {
                // Chế độ phi thuyền: giữ chuột/phím để bay lên, thả ra để chìm xuống
                if (isHolding) {
                    player.vy -= 0.6; // Lực đẩy lên
                } else {
                    player.vy += 0.6; // Trọng lực kéo xuống
                }
                // Giới hạn tốc độ bay tối đa
                if (player.vy > 8) player.vy = 8;
                if (player.vy < -8) player.vy = -8;

                player.y += player.vy;
                player.rotation = player.vy * 3; // Nghiêng theo chiều bay

                // Giới hạn trong khung hình
                if (player.y < 0) { player.y = 0; player.vy = 0; }
                if (player.y > 330) { player.y = 330; player.vy = 0; }
            }

            // Xử lý vật thể và va chạm
            for (let i = 0; i < objects.length; i++) {
                let obj = objects[i];
                obj.x -= gameSpeed;

                // Va chạm Spike (Gai) hoặc Block
                if (obj.type === "spike" || obj.type === "block") {
                    if (
                        player.x < obj.x + obj.w - 5 &&
                        player.x + player.size > obj.x + 5 &&
                        player.y < obj.y + obj.h &&
                        player.y + player.size > obj.y + 5
                    ) {
                        isGameOver = true;
                        createExplosion(player.x + player.size/2, player.y + player.size/2);
                    }
                }

                // Va chạm cổng đổi chế độ
                if (obj.type === "portal_ship" && !obj.activated) {
                    if (player.x < obj.x + obj.w && player.x + player.size > obj.x && player.y < obj.y + obj.h && player.y + player.size > obj.y) {
                        gameMode = "ship";
                        obj.activated = true;
                    }
                }
                if (obj.type === "portal_cube" && !obj.activated) {
                    if (player.x < obj.x + obj.w && player.x + player.size > obj.x && player.y < obj.y + obj.h && player.y + player.size > obj.y) {
                        gameMode = "cube";
                        obj.activated = true;
                    }
                }

                // Về đích
                if (obj.type === "goal" && player.x > obj.x) {
                    isWon = true;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ nền mặt đất
            ctx.fillStyle = "#05050a";
            ctx.fillRect(0, 365, canvas.width, 35);
            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(0, 365, canvas.width, 4);

            // Vẽ các vật thể
            objects.forEach(obj => {
                if (obj.type === "spike") {
                    ctx.fillStyle = "#ff0055";
                    ctx.beginPath();
                    ctx.moveTo(obj.x, obj.y + obj.h);
                    ctx.lineTo(obj.x + obj.w / 2, obj.y);
                    ctx.lineTo(obj.x + obj.w, obj.y + obj.h);
                    ctx.closePath();
                    ctx.fill();
                } else if (obj.type === "block") {
                    ctx.fillStyle = "#333366";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = "#00ffcc";
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                } else if (obj.type === "portal_ship" && !obj.activated) {
                    ctx.fillStyle = "rgba(0, 150, 255, 0.6)";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = "#00ffff";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                } else if (obj.type === "portal_cube" && !obj.activated) {
                    ctx.fillStyle = "rgba(255, 150, 0, 0.6)";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = "#ffaa00";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                }
            });

            // Vẽ hiệu ứng hạt khi nổ
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(index, 1);
            });

            // Vẽ người chơi (nếu chưa chết)
            if (!isGameOver) {
                ctx.save();
                ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                ctx.rotate((player.rotation * Math.PI) / 180);

                if (gameMode === "cube") {
                    ctx.fillStyle = "#00ffcc";
                    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(-player.size / 2 + 4, -player.size / 2 + 4, player.size - 8, player.size - 8);
                } else {
                    // Hình vẽ phi thuyền
                    ctx.fillStyle = "#ff0055";
                    ctx.beginPath();
                    ctx.moveTo(15, 0);
                    ctx.lineTo(-15, -12);
                    ctx.lineTo(-5, 0);
                    ctx.lineTo(-15, 12);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = "#ffffff";
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Màn hình bắt đầu
            if (!isPlaying) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 32px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("GEOMETRY DASH PRO", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "white";
                ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Nhấn Space hoặc Click để Bắt đầu", canvas.width / 2, canvas.height / 2 + 25);
            }

            // Màn hình Game Over
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 38px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "white";
                ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Nhấn Space để Thử lại", canvas.width / 2, canvas.height / 2 + 25);
            }

            // Màn hình Thắng cuộc
            if (isWon) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 38px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("LEVEL COMPLETE!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "white";
                ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Bạn đã qua màn xuất sắc!", canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function loop() {
            update();
            draw();
            if (isPlaying && !isWon) {
                if (isGameOver) {
                    setTimeout(() => {
                        // Dừng vòng lặp khi chết để người chơi nhấn phím chơi lại
                    }, 100);
                } else {
                    requestAnimationFrame(loop);
                }
            }
        }

        // Bắt sự kiện chơi lại khi thua/thắng
        window.addEventListener("keydown", function(e) {
            if ((e.code === "Space" || e.code === "ArrowUp") && (isGameOver || isWon)) {
                startGame();
            }
        });
        canvas.addEventListener("click", function() {
            if (isGameOver || isWon) {
                startGame();
            }
        });

        // Vẽ trạng thái ban đầu
        draw();
    </script>
</body>
</html>
