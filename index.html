<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Polargeist Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: linear-gradient(135deg, #0044cc, #001155);
            border: 4px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            overflow: hidden;
            border-radius: 6px;
        }
        canvas {
            display: block;
            background: #112244;
        }
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }
        .hidden { display: none !important; }

        /* Màn hình chính (Main Menu) */
        #main-menu {
            background: linear-gradient(180deg, #102a43, #0a101d);
            background-size: cover;
        }
        .main-title {
            font-size: 52px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 3px 3px #000, 0 0 15px #ff9900;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-align: center;
        }
        .menu-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .icon-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(to bottom, #72ff52, #208010);
            border: 4px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            transition: 0.1s;
        }
        .icon-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(to bottom, #8aff6c, #2ab316);
        }
        .icon-btn:active {
            transform: scale(0.95);
        }
        .gear-icon {
            font-size: 32px;
        }
        .play-icon {
            font-size: 36px;
            color: #fff;
            padding-left: 4px; /* tạo cảm giác nút play tam giác */
        }

        /* Màn hình cài đặt Polargeist / Settings */
        #settings-screen {
            background: rgba(0, 0, 0, 0.9);
        }
        .settings-panel {
            background: linear-gradient(180deg, #00aa66, #004422);
            border: 5px solid #00ffcc;
            border-radius: 12px;
            width: 550px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,255,204,0.6);
            position: relative;
        }
        .settings-header {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 2px 2px #000;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .settings-option-btn {
            background: linear-gradient(to bottom, #ffeb3b, #f57f17);
            border: 3px solid #ffffff;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: 0.1s;
        }
        .settings-option-btn:hover {
            transform: scale(1.03);
            background: linear-gradient(to bottom, #fff176, #f9a825);
        }
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: linear-gradient(to bottom, #ff5252, #b71c1c);
            border: 3px solid #fff;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }

        /* Giao diện trong game (UI Overlay) */
        #ui-overlay {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 2px #000;
            z-index: 5;
        }
        .progress-bar-container {
            width: 450px;
            height: 14px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #fff;
            border-radius: 7px;
            overflow: hidden;
            margin: 0 auto;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #72ff52);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 1. Màn hình chính (Main Menu - Mô phỏng ảnh nền chuẩn Geometry Dash) -->
    <div id="main-menu" class="screen">
        <div class="main-title">POLARGEIST</div>
        <p style="margin-bottom: 25px; color: #aaddff; font-size: 15px;">Màn chơi đặc biệt phong cách cổ điển</p>
        
        <div class="menu-buttons">
            <!-- Nút Cài đặt (Mở menu cài đặt Polargeist giống ảnh 2) -->
            <button class="icon-btn" onclick="openSettings()" title="Cài đặt Polargeist">
                <span class="gear-icon">⚙️</span>
            </button>
            
            <!-- Nút Chơi game -->
            <button class="icon-btn" onclick="startGame()" title="Bắt đầu chơi">
                <span class="play-icon">▶</span>
            </button>
        </div>
    </div>

    <!-- 2. Màn hình Cài đặt Polargeist (Mô phỏng ảnh 2 & 3) -->
    <div id="settings-screen" class="screen hidden">
        <div class="settings-panel">
            <button class="back-btn" onclick="closeSettings()">◄</button>
            <div class="settings-header">Polargeist Settings</div>
            
            <div class="settings-grid">
                <div class="settings-option-btn">ACCOUNT</div>
                <div class="settings-option-btn">HOW TO PLAY</div>
                <div class="settings-option-btn">RATE</div>
                <div class="settings-option-btn">SONGS</div>
                <div class="settings-option-btn" style="grid-column: span 2;">OPTIONS</div>
            </div>

            <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; text-align: center; border: 2px solid #00ffcc;">
                <p style="color: #00ffcc; font-size: 14px; margin-bottom: 5px;">🎵 Nhạc nền: Polargeist (Stereo Madness Mix)</p>
                <p style="color: #ffcc00; font-size: 13px;">Trạng thái: Đã sẵn sàng kích hoạt đồ họa 2.1</p>
            </div>
        </div>
    </div>

    <!-- 3. Màn hình Thua / Thắng (Game Over / Win) -->
    <div id="game-over-screen" class="screen hidden">
        <h1 id="result-title" style="font-size: 38px; color: #ff5252;">THẤT BẠI</h1>
        <p id="result-score" style="margin-bottom: 20px; font-size: 18px;">Hoàn thành: 0%</p>
        <div style="display: flex; gap: 15px;">
            <button class="settings-option-btn" style="padding: 10px 25px;" onclick="startGame()">THỬ LẠI</button>
            <button class="settings-option-btn" style="padding: 10px 25px; background: linear-gradient(to bottom, #ff5252, #c62828); color:#fff;" onclick="returnToMenu()">MENU</button>
        </div>
    </div>

    <!-- 4. Giao diện trong màn chơi (UI Overlay) -->
    <div id="ui-overlay" class="hidden">
        <div>Màn: <span id="level-name" style="color: #72ff52;">POLARGEIST</span></div>
        <div style="flex-grow: 1; text-align: center;">
            <div class="progress-bar-container">
                <div id="progress" class="progress-bar"></div>
            </div>
        </div>
        <div>Thử: <span id="attempts">1</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU'; // MENU, SETTINGS, PLAYING, GAMEOVER
let attempts = 1;
let score = 0;
let gameSpeed = 6.5;
let levelLength = 6000;
let cameraX = 0;

// Cấu hình nhân vật hình vuông chuẩn theo ảnh (Màu xanh lá sáng viền đen + nhân vật con bên trong)
const player = {
    x: 150,
    y: 300,
    size: 32,
    vy: 0,
    gravity: 0.85,
    jumpForce: -13,
    rotation: 0,
    isGrounded: false
};

const obstacles = [];

function generateLevel() {
    obstacles.length = 0;
    let currentX = 600;
    while (currentX < levelLength - 400) {
        let type = Math.random();
        if (type < 0.35) {
            obstacles.push({ x: currentX, y: 350, w: 32, h: 32, type: 'spike' });
            currentX += 170 + Math.random() * 80;
        } else if (type < 0.65) {
            obstacles.push({ x: currentX, y: 350, w: 32, h: 32, type: 'spike' });
            obstacles.push({ x: currentX + 30, y: 350, w: 32, h: 32, type: 'spike' });
            currentX += 260 + Math.random() * 100;
        } else {
            let blockH = 64;
            obstacles.push({ x: currentX, y: 382 - blockH, w: 64, h: blockH, type: 'block' });
            if (Math.random() > 0.4) {
                obstacles.push({ x: currentX + 16, y: 382 - blockH - 32, w: 32, h: 32, type: 'spike' });
            }
            currentX += 300 + Math.random() * 120;
        }
    }
}

function openSettings() {
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('settings-screen').classList.remove('hidden');
}

function closeSettings() {
    document.getElementById('settings-screen').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
}

function startGame() {
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('settings-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('ui-overlay').classList.remove('hidden');

    player.x = 150;
    player.y = 300;
    player.vy = 0;
    player.rotation = 0;
    cameraX = 0;
    
    generateLevel();
    gameState = 'PLAYING';
}

function returnToMenu() {
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('ui-overlay').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
    gameState = 'MENU';
}

function gameOver() {
    gameState = 'GAMEOVER';
    attempts++;
    document.getElementById('attempts').innerText = attempts;
    document.getElementById('result-title').innerText = 'THẤT BẠI';
    document.getElementById('result-title').style.color = '#ff5252';
    document.getElementById('result-score').innerText = `Hoàn thành: ${Math.floor(score)}%`;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

function gameWin() {
    gameState = 'GAMEOVER';
    document.getElementById('result-title').innerText = 'HOÀN THÀNH POLARGEIST!';
    document.getElementById('result-title').style.color = '#72ff52';
    document.getElementById('result-score').innerText = `Hoàn thành: 100%`;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
    }
});

canvas.addEventListener('mousedown', () => {
    jump();
});

function jump() {
    if (gameState === 'PLAYING' && player.isGrounded) {
        player.vy = player.jumpForce;
        player.isGrounded = false;
    }
}

function update() {
    if (gameState !== 'PLAYING') return;

    cameraX += gameSpeed;
    player.vy += player.gravity;
    player.y += player.vy;

    score = Math.min(100, (cameraX / levelLength) * 100);
    document.getElementById('progress').style.width = score + '%';

    if (cameraX >= levelLength) {
        gameWin();
        return;
    }

    let groundY = 382 - player.size;
    player.isGrounded = false;

    if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.isGrounded = true;
        player.rotation = Math.round(player.rotation / 90) * 90;
    }

    let pBox = { x: player.x + 4, y: player.y + 4, w: player.size - 8, h: player.size - 8 };

    for (let obs of obstacles) {
        let screenObsX = obs.x - cameraX;
        if (screenObsX > -100 && screenObsX < canvas.width + 100) {
            let oBox = { x: screenObsX, y: obs.y, w: obs.w, h: obs.h };

            if (pBox.x < oBox.x + oBox.w &&
                pBox.x + pBox.w > oBox.x &&
                pBox.y < oBox.y + oBox.h &&
                pBox.y + pBox.h > oBox.y) {
                
                if (obs.type === 'spike') {
                    gameOver();
                } else if (obs.type === 'block') {
                    let prevY = player.y - player.vy;
                    if (prevY + player.size <= obs.y + 10 && player.vy >= 0) {
                        player.y = obs.y - player.size;
                        player.vy = 0;
                        player.isGrounded = true;
                        player.rotation = Math.round(player.rotation / 90) * 90;
                    } else {
                        gameOver();
                    }
                }
            }
        }
    }

    if (!player.isGrounded) {
        player.rotation += 9;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Nền Polargeist đặc trưng (Tone xanh đậm chuyển sắc)
    let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#0033aa');
    bgGrad.addColorStop(1, '#001133');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Lưới nền mờ
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;
    let gridSize = 40;
    let offsetX = -(cameraX % gridSize);
    for (let x = offsetX; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    // Vẽ chướng ngại vật
    for (let obs of obstacles) {
        let screenX = obs.x - cameraX;
        if (screenX > -100 && screenX < canvas.width + 100) {
            if (obs.type === 'spike') {
                ctx.fillStyle = '#111111';
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(screenX, obs.y + obs.h);
                ctx.lineTo(screenX + obs.w / 2, obs.y);
                ctx.lineTo(screenX + obs.w, obs.y + obs.h);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (obs.type === 'block') {
                ctx.fillStyle = '#002244';
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.fillRect(screenX, obs.y, obs.w, obs.h);
                ctx.strokeRect(screenX, obs.y, obs.w, obs.h);
                
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(screenX + 8, obs.y + 8, obs.w - 16, obs.h - 16);
            }
        }
    }

    // Vẽ sàn nhà Polargeist (Xanh lá đậm)
    let groundY = 382;
    ctx.fillStyle = '#008844';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();

    ctx.fillStyle = '#00cc66';
    let floorGridSize = 32;
    let floorOffsetX = -(cameraX % floorGridSize);
    for (let x = floorOffsetX; x < canvas.width; x += floorGridSize) {
        ctx.fillRect(x, groundY + 4, floorGridSize - 4, 12);
    }

    // Vẽ nhân vật hình vuông (Cube) y chang hình ảnh mẫu (Xanh lá sáng + ô vuông xanh dương bên trong)
    ctx.save();
    ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
    ctx.rotate((player.rotation * Math.PI) / 180);

    ctx.fillStyle = '#72ff52';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
    ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);

    ctx.fillStyle = '#0055ff';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    let innerSize = 14;
    ctx.fillRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize);
    ctx.strokeRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize);

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
